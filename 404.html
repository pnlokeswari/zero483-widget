<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting... | ZERO483</title>
  <meta name="robots" content="noindex, follow" />

  <!-- Smart Auto-Recovery Redirect Script (Executes before page renders) -->
  <script>
    (function() {
      try {
        var path = window.location.pathname || '';
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // Clean trailing dots, commas, quotes, or accidental punctuation from social shares (Pinterest, WhatsApp, Twitter)
        // Example: /devotional/page.html. -> /devotional/page.html
        var cleanedPath = path;

        // 1. Remove trailing dots or accidental punctuation at the end of .html
        if (/\.html[\.\,\)\>\'\"\]]+$/i.test(cleanedPath)) {
          cleanedPath = cleanedPath.replace(/\.html[\.\,\)\>\'\"\]]+$/i, '.html');
        }

        // 2. Remove any other trailing dot(s)
        if (/\.+$/.test(cleanedPath)) {
          cleanedPath = cleanedPath.replace(/\.+$/, '');
        }

        // 3. Fix internal .html. occurrences (e.g. /page.html./)
        if (cleanedPath.indexOf('.html.') !== -1) {
          cleanedPath = cleanedPath.replace(/\.html\.+/gi, '.html');
        }

        // If path was modified and cleaned up, execute instant seamless redirect
        if (cleanedPath !== path) {
          var targetUrl = window.location.origin + cleanedPath + search + hash;
          window.location.replace(targetUrl);
          return;
        }
      } catch (e) {
        console.error("Auto-redirect error:", e);
      }
    })();
  </script>

  <style>

    .btn-primary:hover {

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;

    .btn-secondary:hover {

    }
  </style>

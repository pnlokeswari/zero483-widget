 emerged from the U.S. Food and Drug Administration (FDA), which has officially declared a current shortage of Lisdexamfetamine Dimesylate Capsules. While the generic name might not immediately ring a bell for everyone, this medication is the active pharmaceutical ingredient behind Vyvanse, a widely prescribed stimulant used to treat Attention-Deficit/Hyperactivity Disorder (ADHD) in adults and children, and moderate to severe Binge Eating Disorder (BED) in adults. The \"N/A\" status for a specific brand name indicates that this shortage primarily affects the generic versions of the drug, which typically offer more affordable and accessible options for patients.</p> <p>This isn't merely a bureaucratic announcement; it represents a significant disruption in access to essential medication for millions of Americans. Lisdexamfetamine Dimesylate is a prodrug, meaning it\u2019s inactive until metabolized by the body, offering a smoother, longer-lasting effect compared to some other ADHD stimulants. Its unique pharmacokinetic profile has made it a preferred choice for many patients and clinicians, especially those seeking consistent symptom control throughout the day with a lower risk of misuse compared to immediate-release stimulants.</p> <p>The declaration of a \"current\" shortage signals that the availability issues are ongoing and widespread, impacting pharmacies nationwide and leaving patients struggling to fill their prescriptions. The reasons behind such shortages are often complex and multifaceted, ranging from manufacturing delays or quality control issues at generic drug facilities, unexpected surges in demand following Vyvanse's patent expiration in August 2023, or even supply chain bottlenecks for critical raw materials. Regardless of the precise cause, the outcome is the same: profound anxiety and potential treatment interruptions for individuals who rely on this medication for their daily functioning, academic performance, and professional productivity.</p> <p>For patients managing ADHD, consistent medication is crucial for managing core symptoms like inattention, hyperactivity, and impulsivity. For those with Binge Eating Disorder, Lisdexamfetamine Dimesylate plays a vital role in reducing binge episodes. A shortage means not only the inconvenience of searching multiple pharmacies but also the very real possibility of a lapse in treatment, which can lead to a return of debilitating symptoms, affecting mental health, relationships, and overall quality of life. The FDA's role in publicly identifying these shortages is crucial for transparency and to galvanize efforts across the pharmaceutical supply chain to mitigate the impact and restore consistent availability.</p>", "compliance_impact": "<ul> <li><b>Patient Well-being and Treatment Adherence:</b> The most immediate impact is on patients who rely on Lisdexamfetamine Dimesylate. Disrupted access can lead to a return of ADHD or BED symptoms, affecting daily functioning, academic performance, and occupational stability. The stress and anxiety associated with finding medication can also significantly degrade mental health.</li> <li><b>Increased Burden on Healthcare Providers and Pharmacies:</b> Clinicians face the challenge of finding suitable alternative treatments, which may not always be straightforward due to individual patient responses or potential shortages of other stimulants. Pharmacists are burdened with managing dwindling supplies, fielding patient inquiries, and navigating complex ordering processes, often spending significant time communicating availability issues.</li> <li><b>Potential for Market Instability and Counterfeits:</b> Shortages can create an unstable market, potentially leading to price increases for available stock, or, more dangerously, driving desperate patients towards unregulated or counterfeit sources, posing serious health risks. It also highlights vulnerabilities in the generic drug supply chain.</li> <li><b>Heightened Regulatory Focus on Supply Chain Resilience:</b> The FDA and other regulatory bodies will intensify their monitoring of generic manufacturers to understand the root causes and push for resolutions. This incident underscores the ongoing need for robust manufacturing practices and diversified supply chains to prevent future critical shortages of essential medicines.</li> </ul>", "key_actions": "<ul> <li><b>For Patients and Prescribing Physicians:</b> Patients should immediately contact their prescribing doctor to discuss the shortage and explore potential strategies, such as alternative formulations, different dosages, or substitute medications, if medically appropriate. Physicians should stay informed on FDA updates and proactively communicate with patients, being prepared to offer clinically sound alternatives.</li> <li><b>For Pharmacies:</b> Actively monitor inventory and communicate with suppliers and manufacturers for the latest availability information. Transparently inform patients about the shortage and guide them on next steps, such as contacting their prescriber or checking other pharmacy locations, to minimize distress.</li> <li><b>For Generic Manufacturers:</b> This situation highlights the critical need to review and strengthen supply chain resilience. Manufacturers should identify potential choke points for raw materials or manufacturing capacity and enhance communication protocols with the FDA to provide timely updates on production status and projected availability.</li> </ul>", "industry_context": "<p>Lisdexamfetamine Dimesylate, originally developed by Shire (now Takeda Pharmaceuticals) and launched as Vyvanse in 2007, represents a significant advancement in the treatment of ADHD and Binge Eating Disorder. Its unique formulation as a prodrug means the active amphetamine component is only released after metabolism in the body, leading to a smoother, longer-lasting effect and a lower potential for abuse compared to immediate-release stimulants. This pharmacokinetic profile made it a preferred option for many, leading to its widespread adoption and significant market share in the stimulant medication landscape.</p> <p>The therapeutic importance of Lisdexamfetamine cannot be overstated. For millions diagnosed with ADHD, the medication helps to regulate brain chemicals, improving focus, reducing impulsivity, and enabling better academic and occupational performance. Similarly, for individuals battling Binge Eating Disorder, it offers a crucial tool in managing the debilitating cycles of compulsive eating. A consistent supply of such a vital medication is paramount for maintaining patient stability and avoiding severe health and quality-of-life repercussions.</p> <p>The current shortage of generic Lisdexamfetamine Dimesylate comes on the heels of a major market shift: the expiration of Vyvanse\u2019s patent in August 2023. This event typically ushers in a wave of generic manufacturers, promising increased accessibility and affordability. While increased competition generally benefits consumers, the rapid influx of generic production can sometimes strain manufacturing capabilities, raw material supplies, or create unexpected demand surges that even multiple manufacturers struggle to meet. These factors, alongside potential quality control hurdles inherent in scaling up production, often contribute to the complex web of causes behind generic drug shortages, impacting not just individual patients but the entire healthcare ecosystem.</p>", "seo_title": "Vyvanse Generic Shortage Deepens: What Patients and Providers Need to Know", "seo_description": "A critical shortage of generic Lisdexamfetamine Dimesylate (Vyvanse) is impacting patients. Learn why this ADHD medication is scarce, its impact, and what steps to take.", "primary_company_name": null, "source_url": "https://www.accessdata.fda.gov/scripts/drugshortages/default.cfm", "fetched_at": "2026-08-20T08:19:40.635745+00:00", "is_long_form": true}, {"id": "457322882461", "title": "Approval of targeted drug for children with ALL - Prinses Maxima Centrum", "slug": "approval-of-targeted-drug-for-children-with-all-prinses-maxima-centrum", "date": "2026-08-20", "category": "Drug Approval", "severity": "Low", "summary": "<p>This **Featured Article** on Zero483 highlights a monumental leap forward in pediatric oncology with the European Medicines Agency's (EMA) recent approval of a new targeted therapy for children suffering from Acute Lymphoblastic Leukemia (ALL). This landmark decision, announced on Thursday, August 20, 2026, ushers in a new era of hope for countless families across Europe and beyond, marking a significant advancement in the fight against one of the most common childhood cancers. The approval underscores years of dedicated research, clinical trials, and collaborative efforts, including vital contributions from institutions like the Prinses Maxima Centrum, a leading center for pediatric oncology in the Netherlands.</p><p>Acute Lymphoblastic Leukemia is a formidable foe, characterized by the rapid growth of abnormal white blood cells in the bone marrow, blood, and other organs. While survival rates for children with ALL have steadily improved over the past decades thanks to intensive chemotherapy, a subset of patients still face significant challenges, including those with relapsed or refractory disease who do not respond well to conventional treatments. For these children, options have traditionally been limited, often leading to grim prognoses. The advent of a targeted therapy represents a paradigm shift, moving beyond broad-spectrum chemotherapy to precisely attack cancer cells while sparing healthy ones, thereby potentially reducing severe side effects and improving quality of life.</p><p>This innovative drug is designed to specifically interfere with molecular pathways crucial for the growth and survival of ALL cells. Unlike traditional chemotherapy, which can damage rapidly dividing healthy cells along with cancer cells, targeted therapies are developed to identify and act on specific genetic mutations or protein expressions unique to the cancer. This precision medicine approach has been a game-changer in adult oncology, and its successful application and approval for a pediatric population signify a major milestone, promising more effective and less toxic treatment regimens for our most vulnerable patients.</p><p>The EMA's rigorous evaluation process, which culminated in this approval, involved extensive review of clinical trial data demonstrating the therapy's safety and efficacy in pediatric patients. The positive outcome reflects a robust body of evidence indicating that this new treatment can offer a lifeline to children who have exhausted other options, potentially transforming the treatment landscape for ALL and offering renewed hope to families desperately seeking better outcomes for their children.</p>", "compliance_impact": "<ul><li><strong>Enhanced Patient Access to Novel Therapies:</strong> Children in European Union member states diagnosed with ALL, particularly those with relapsed or refractory disease, will gain access to a cutting-edge treatment option previously unavailable, potentially improving survival rates and quality of life.</li><li><strong>Shift in Clinical Treatment Paradigms:</strong> Healthcare providers and pediatric oncologists will need to integrate this new targeted therapy into existing treatment algorithms, requiring updated guidelines, training, and careful patient selection based on specific molecular profiles.</li><li><strong>Incentive for Pediatric Drug Development:</strong> This successful EMA approval will likely galvanize further research and investment in pediatric oncology, encouraging pharmaceutical companies to explore and develop more targeted and less toxic therapies for various childhood cancers.</li><li><strong>Increased Scrutiny on Diagnostics:</strong> The success of targeted therapy often hinges on accurate diagnostic testing to identify specific molecular targets. This approval will heighten the importance of robust biomarker testing and genetic profiling capabilities in pediatric oncology centers.</li><li><strong>Potential for Global Regulatory Harmonization:</strong> While an EMA approval, it often serves as a significant signal for other regulatory bodies globally, including the US FDA. This could facilitate faster reviews and approvals in other jurisdictions, broadening the global impact of this therapy.</li></ul>", "key_actions": "<ul><li><strong>For Healthcare Providers and Oncologists:</strong> Familiarize yourselves with the new therapy's mechanism of action, efficacy data, safety profile, and precise indications. Prepare to integrate it into your treatment protocols, ensure access to necessary diagnostic testing for patient selection, and engage in ongoing education.</li><li><strong>For Patients and Their Families:</strong> Discuss this new treatment option with your pediatric oncologist to understand if it is relevant for your child's specific condition. Stay informed about available support resources and potential treatment centers offering this therapy.</li><li><strong>For Pharmaceutical Companies and Researchers:</strong> Continue to invest in and prioritize pediatric oncology research, particularly in targeted therapies and precision medicine. Explore opportunities for combination therapies and expand indications for existing targeted drugs.</li><li><strong>For Regulatory Bodies and Policy Makers:</strong> Evaluate the long-term impact of this approval on patient outcomes and healthcare systems. Consider policies that facilitate equitable access, manage healthcare costs, and streamline the approval process for critically needed pediatric medicines.</li><li><strong>For Medical Institutions and Research Centers:</strong> Enhance capabilities in molecular diagnostics and personalized medicine to ensure accurate patient stratification for targeted therapies. Participate actively in post-market surveillance and real-world evidence generation to further understand the therapy's long-term benefits and risks.</li></ul>", "industry_context": "<p>Acute Lymphoblastic Leukemia (ALL) stands as the most prevalent childhood cancer, with thousands of diagnoses each year globally. While advances in chemotherapy protocols have dramatically improved survival rates\u2014often exceeding 80%\u2014a significant portion of children still face relapse or do not respond to initial treatment. For these patients, the prognosis remains challenging, highlighting an urgent unmet medical need for more effective and less toxic therapeutic options. The standard of care traditionally involves intensive, multi-drug chemotherapy regimens, sometimes followed by stem cell transplantation, which can have severe short-term and long-term side effects impacting a child's development and quality of life.</p><p>The development of targeted therapies represents a revolutionary shift in oncology. Instead of broadly attacking fast-growing cells, these drugs zero in on specific molecular abnormalities found in cancer cells, such as overactive proteins or mutated genes that drive tumor growth. This precision approach aims to maximize therapeutic effect while minimizing damage to healthy tissues, thereby reducing the debilitating side effects often associated with conventional chemotherapy. In pediatric oncology, where the developing bodies of children are particularly susceptible to the toxicities of traditional treatments, the promise of targeted therapy is even more profound.</p><p>This EMA approval underscores a growing trend in pharmaceutical research and development: a dedicated focus on rare diseases and pediatric indications. Developing drugs for children presents unique challenges, including smaller patient populations for clinical trials, ethical considerations, and the need for child-friendly formulations. However, the critical need for better treatments for pediatric cancers, coupled with regulatory incentives and a deeper scientific understanding of cancer biology, has propelled significant investment in this area. Institutions like the Prinses Maxima Centrum in Utrecht, Netherlands, are at the forefront of this global effort, specializing in pediatric oncology and playing a crucial role in advancing research, conducting clinical trials, and advocating for innovative treatments for children with cancer.</p><p>The approval of this new targeted therapy by the EMA not only provides a vital new tool for clinicians but also reinforces the feasibility and importance of developing highly specialized treatments for pediatric populations. It signals a maturation of precision medicine principles within pediatric oncology, paving the way for future innovations and collaborative efforts between academic centers, pharmaceutical companies, and regulatory bodies worldwide to address the unique challenges of childhood cancer.</p>", "seo_title": "Breakthrough in Pediatric ALL: EMA Approves New Targeted Therapy for Children's Leukemia", "seo_description": "The European Medicines Agency (EMA) has approved a groundbreaking targeted therapy for children with Acute Lymphoblastic Leukemia (ALL). Discover its impact on pediatric oncology.", "primary_company_name": null, "source_url": "https://news.google.com/rss/articles/CBMilwFBVV95cUxPZGl1YmROc21wYnJmN3EtSWltNmJmbFZma25VeTVPOC11VldoZ1RiclhCQWxpTFlsTlk1TXo3THU1TGkzVXp3UmNXck9tN0ZMUmxtQ1YtYndLTUdUZ2RfVVNGck1hVDd1QU1tMDlLZzlRc29SUUZmVENpTHloREFzbmdEMFVwbm0tY1ZKYUN6Z2JtS0lWelhj?oc=5", "fetched_at": "2026-08-20T07:37:37.264589+00:00", "is_long_form": true}, {"id": "99a3428c0899", "title": "Lazertinib Surpasses $300 Million in Milestone Payments Two Years After FDA Approval \u2014 Third-Year Quantum Jump Expected ", "slug": "lazertinib-surpasses-300-million-in-milestone-payments-two-years-after-fda-approval-third-year-quantum-jump-expected", "date": "2026-08-20", "category": "Drug Approval", "severity": "Low", "summary": "<p>Title: Lazertinib Surpasses $300 Million in Milestone Payments Two Years After FDA Approval \u2014 Third-Year Quantum Jump Expected - finance.biggo.com\nSource: Google News\nDate: Thu, 20 Aug 2026 07:06:00 GMT</p>", "compliance_impact": "<ul><li>Review the details of this regulatory action to assess potential public or market implications.</li></ul>", "key_actions": "<ul><li>Discuss this update with relevant team members or advisors to evaluate next steps.</li></ul>", "industry_context": "", "seo_title": "Lazertinib Surpasses $300 Million in Milestone Payments Two Years After FDA Approval \u2014 Third-Year Quantum Jump Expected ", "seo_description": "", "primary_company_name": null, "source_url": "https://news.google.com/rss/articles/CBMidkFVX3lxTFBkRDdTNEdqQ1JTbXlhOUNxSmtrMjczbEt1SlgyczhwOUJrRjFMekFFMEZXbFZKRVJvODlUVkh2NDFFMEdHN0xXOXhWeC1lck5keWlVMGFZRXRlTTMydDhaSDl4Ym5IVG1tSlktZDllcFoyRzg1d2c?oc=5", "fetched_at": "2026-08-20T07:34:20.476531+00:00", "is_long_form": false}, {"id": "cf83b4ad934d", "title": "Drug Shortage: Technetium TC-99M Pyrophosphate Kit Injection", "slug": "drug-shortage-technetium-tc-99m-pyrophosphate-kit-injection", "date": "2026-08-20", "category": "Drug Shortage", "severity": "Medium", "summary": "<p>This <b>Featured Article</b> on Zero483 delves into a critical US FDA regulatory update concerning a drug shortage that carries significant implications for diagnostic medicine: the Technetium TC-99M Pyrophosphate Kit Injection. While the generic name might sound complex, this radioactive diagnostic agent is a cornerstone in nuclear medicine, playing an indispensable role in detecting a range of serious conditions, from bone pathologies to a notoriously underdiagnosed heart condition.</p><p>The current 'Status: Current' designation by the FDA means that healthcare providers and patients are facing immediate challenges. The Technetium TC-99M Pyrophosphate Kit is integral to procedures like bone scintigraphy, which helps identify fractures, infections, and metastatic cancer in bones. Crucially, it's also a key tool for diagnosing Transthyretin Amyloid Cardiomyopathy (ATTR-CM), a progressive and often fatal heart disease. The kit, when combined with the radioisotope Technetium-99m (Tc-99m), forms an imaging agent that accumulates in amyloid deposits in the heart, allowing clinicians to non-invasively detect the condition\u2014a significant advancement given that ATTR-CM often requires timely diagnosis for effective management.</p><p>A shortage of this vital diagnostic kit means potential delays or even missed diagnoses for patients awaiting these critical tests. For individuals suspected of having ATTR-CM, a delay could mean a missed window for intervention, leading to accelerated disease progression and poorer outcomes. Similarly, for patients with bone pain or suspected bone metastases, the absence of this imaging agent could prolong diagnostic uncertainty and impact treatment planning. The ripple effect extends throughout the healthcare system, straining resources as providers seek alternative, potentially less effective, or more invasive diagnostic pathways.</p><p>This particular shortage also underscores a broader, long-standing vulnerability within the global supply chain for medical radioisotopes, especially Technetium-99m. Tc-99m is derived from Molybdenum-99 (Mo-99), which is primarily produced in a handful of aging nuclear reactors worldwide. Any disruption\u2014be it scheduled maintenance, unexpected shutdowns, or manufacturing issues with the kits themselves\u2014can quickly cascade into global shortages. The FDA\u2019s active tracking and reporting of such shortages aim to provide transparency and encourage swift action from manufacturers and the wider industry to mitigate patient impact and ensure continuity of care.</p>", "compliance_impact": "<ul><li><b>Patient Care Disruptions:</b> Patients needing critical diagnostic imaging for conditions like cardiac amyloidosis or bone pathologies may experience significant delays, leading to prolonged uncertainty, potential disease progression without intervention, and increased anxiety.</li><li><b>Clinical Practice Adjustments:</b> Healthcare providers may be forced to explore less optimal, more invasive, or more expensive alternative diagnostic tests, impacting clinical workflow, increasing procedure costs, and potentially compromising diagnostic accuracy or timeliness.</li><li><b>Heightened Supply Chain Vulnerability:</b> This shortage underscores the inherent fragility of the global radioisotope supply chain, particularly for Mo-99/Tc-99m, reinforcing the need for more resilient, diversified, and transparent manufacturing and distribution networks.</li><li><b>Increased Healthcare System Burden:</b> Hospitals and imaging centers must dedicate additional resources to manage the shortage, including sourcing alternatives, re-scheduling patients, and navigating complex supply logistics, leading to operational inefficiencies and financial strain.</li><li><b>Regulatory Scrutiny and Innovation Drive:</b> The FDA's active monitoring of such shortages places increased pressure on manufacturers to address supply issues and encourages investment in research and development for new production methods for radioisotopes and alternative diagnostic imaging agents.</li></ul>", "key_actions": "<ul><li><b>For Healthcare Providers:</b> Proactively monitor FDA shortage updates and communications from suppliers. Prioritize existing supplies for the most critical patient cases, and establish clear communication protocols with referring physicians and patients regarding potential diagnostic delays and alternative pathways.</li><li><b>For Patients and Caregivers:</b> Engage in open dialogue with your healthcare provider about your diagnostic needs. Understand the potential impact of this shortage on your imaging schedule and inquire about any alternative diagnostic options or management strategies available to you.</li><li><b>For Manufacturers and Suppliers:</b> Implement robust risk management strategies for your supply chains, including diversifying raw material sources for Mo-99/Tc-99m and exploring alternative production technologies. Maintain transparent and timely communication with regulatory bodies and healthcare customers regarding supply status.</li><li><b>For Industry Stakeholders and Policymakers:</b> Support initiatives aimed at developing domestic, non-reactor-based production methods for Mo-99/Tc-99m to enhance supply chain resilience. Encourage innovation in diagnostic imaging technologies to reduce reliance on single-source critical components.</li></ul>", "industry_context": "<p>Technetium-99m (Tc-99m) is, by far, the most widely used medical isotope globally, accounting for an estimated 80% of all diagnostic nuclear medicine procedures. Its versatility stems from its ideal properties for medical imaging: a short half-life (around six hours) that minimizes patient radiation exposure while providing sufficient time for imaging, and a gamma-ray energy suitable for common imaging equipment. However, the production of Tc-99m is inherently complex. It is a decay product of Molybdenum-99 (Mo-99), which is almost exclusively produced in a handful of aging research nuclear reactors around the world using highly enriched uranium (HEU). This reliance on a few facilities creates an incredibly fragile and susceptible supply chain, which has historically led to numerous, often severe, shortages of Tc-99m.</p><p>The Technetium TC-99M Pyrophosphate Kit is a crucial component that allows the Tc-99m isotope to be used effectively. These 'kits' are essentially pharmaceutical preparations containing a ligand (in this case, pyrophosphate) that, when mixed with freshly eluted Tc-99m from a generator, forms a specific radiopharmaceutical. This complex then targets particular tissues or organs in the body. For pyrophosphate, its affinity for hydroxyapatite crystals makes it excellent for bone imaging, highlighting areas of increased bone turnover like fractures, infections, or metastatic lesions. More recently, its unique binding properties to amyloid fibrils have made it an indispensable, non-invasive diagnostic tool for Transthyretin Amyloid Cardiomyopathy (ATTR-CM), a progressive and potentially fatal condition where amyloid proteins build up in the heart muscle.</p><p>The importance of this kit for ATTR-CM diagnosis cannot be overstated. Before its widespread adoption, confirming ATTR-CM often required an invasive heart biopsy, a procedure with its own risks and limitations. Tc-99m pyrophosphate imaging offers a highly specific, non-invasive alternative, allowing for earlier diagnosis and, critically, earlier initiation of disease-modifying therapies that can slow its progression. A shortage, therefore, doesn't just impact general bone scans; it directly threatens the ability to diagnose a specific, life-threatening heart condition, potentially leading to delayed treatment and poorer patient outcomes. This incident highlights the ongoing need for diversification in Mo-99/Tc-99m production and robust inventory management within the pharmaceutical supply chain to safeguard essential diagnostic capabilities.</p>", "seo_title": "FDA Alerts: Critical Shortage of Technetium TC-99M Pyrophosphate Kit \u2013 Impact on Diagnosis & Patient Care", "seo_description": "A deep dive into the FDA's alert on Technetium TC-99M Pyrophosphate Kit shortage. Understand its impact on cardiac amyloidosis and bone imaging, and what it means for healthcare.", "primary_company_name": null, "source_url": "https://www.accessdata.fda.gov/scripts/drugshortages/default.cfm", "fetched_at": "2026-08-20T07:29:02.681635+00:00", "is_long_form": true}, {"id": "cf06ca7088ed", "title": "Govt shortlists 20 candidates for Drug Inspector (Medical Devices) posts in CDSCO - Whispers in the Corridors", "slug": "govt-shortlists-20-candidates-for-drug-inspector-medical-devices-posts-in-cdsco-whispers-in-the-c   function applyFilters() {
    const q = searchQuery.toLowerCase().trim();
    const filtered = allItems.filter(item => {
      const matchCat = activeFilter === 'All' || item.category === activeFilter;
      if (!matchCat) return false;
      if (!q) return true;
      return (
        (item.title  || '').toLowerCase().includes(q) ||
        (item.summary|| '').toLowerCase().includes(q)
      );
    });
    renderFeed(filtered);
  }

  function init() {
    if (INJECTED_DATA && INJECTED_DATA.items) {
      allItems = INJECTED_DATA.items.filter(i => ['Recall', 'Drug Shortage', 'Adverse Event'].includes(i.category));
      
      const params = new URLSearchParams(window.location.search);
      if (params.has('q')) {
        searchQuery = params.get('q');
        searchInput.value = searchQuery;
      }
      
      applyFilters();
      
      // Initialize Ticker
      const tickerWrap = document.getElementById('z483-ticker-wrap');
      const tickerContent = document.getElementById('z483-ticker-content');
      if (tickerWrap && tickerContent && allItems.length > 0) {
        const top5 = allItems.slice(0, 5);
        let tHtml = top5.map(i => `<a href="${escHtml(i.source_url)}" target="_blank" class="z483-ticker-item">${escHtml(stripHtml(i.title))}</a>`).join(' &bull; ');
        tickerContent.innerHTML = tHtml + ' &bull; ' + tHtml; // Duplicate for seamless scroll
        tickerWrap.style.display = 'flex';
      }
    } else {
      feed.innerHTML = `
        <div class="z483-state">
          <h3>No Data Available</h3>
          <p>Please run the python script to inject data.</p>
        </div>`;
    }
  }

  // Fallback data for local preview if no injected data
  if (!INJECTED_DATA) {
    setTimeout(() => {
      // If still null, just clear
      if (!allItems.length) {
        init();
      }
    }, 100);
  } else {
    init();
  }

, "slug": "cdsco-warns-against-painkiller-antibiotic-misuse-over-kidney-and-amr-risks-india-today", "date": "2026-09-22", "category": "Warning Letter", "severity": "High", "summary": "<p>Title: CDSCO warns against painkiller, antibiotic misuse over kidney and AMR risks - India Today\nSource: CDSCO India\nDate: Tue, 22 Sep 2026 13:04:52 GMT</p>", "compliance_impact": "<ul><li>Review the details of this regulatory action to assess potential public or market implications.</li></ul>", "key_actions": "<ul><li>Discuss this update with relevant team members or advisors to evaluate next steps.</li></ul>", "industry_context": "", "seo_title": "CDSCO warns against painkiller, antibiotic misuse over kidney and AMR risks - India Today", "seo_description": "", "primary_company_name": null, "source_url": "https://news.google.com/rss/articles/CBMivAFBVV95cUxPcFdLRWZzbFRJZTU5a1NPLUZGTVZic0dYcUdVZVlUenRWMzdHYTFpV0RJY3poLUxxaUhndVNtWTdNNkhvZlVRUnRqVWw0ZTF5R1dfMXZrd2psVXo1VVF6RmNXcnBmSXVfeTJxY0VvTTRvbF9OYnVIaVV3czRGUl91MS0zUDRCTTBFMVBkWTBvZkIzMlB6WkpTd29kYUJrQmJydkhGNkdYQXp5cUFPb1Y4Vmk2ZE5PV3MydldDSNIBwgFBVV95cUxQQUZhcDNXckV6TXhzXzZtRjZhYlI3cjdOSXU2M2ktOWJTVmFhMDIxNFhncVdoR0FfajIzT2lScnJQMm5BQzRXSXBzSkYweUpnbThRY1RWTE9oRmpCQlNZQVVueWhzd2Joa0laY19HZWZ6SDF2VURISUlCcGNZVmIzcDZTZlVpa250RWZEUkVicHpEajZzZTBNOGpMRHpHY2Zmc3IzejRna2hNc29SOXFIVjc0dThCeFc0Z00xVnZkRmNoZw?oc=5", "fetched_at": "2026-09-22T15:20:09.603414+00:00", "is_long_form": false}, {"id": "e5d422cc1af3", "title": "CDSCO flags indiscriminate use of painkillers, antibiotics over CKD risk - Business Standard", "slug": "cdsco-flags-indiscriminate-use-of-painkillers-antibiotics-over-ckd-risk-business-standard", "date": "2026-09-22", "category": "Warning Letter", "severity": "High", "summary": "<p>This <b>Featured Article</b> on Zero483 delves into a significant public health alert issued by India's apex drug regulatory body, the Central Drugs Standard Control Organisation (CDSCO). In a crucial move aimed at safeguarding public health, the CDSCO has raised a red flag concerning the widespread and often indiscriminate use of commonly available painkillers and antibiotics, highlighting a concerning link to an increased risk of Chronic Kidney Disease (CKD). This proactive warning underscores the regulator's commitment to patient safety and sheds light on a growing silent epidemic fueled by easily accessible medication.</p><p>The CDSCO's alert isn't just a routine advisory; it's a wake-up call addressing deeply ingrained habits of self-medication and over-prescription that have become prevalent in many parts of the world, particularly in regions where over-the-counter access to these drugs is common. Painkillers, especially a class known as Non-Steroidal Anti-Inflammatory Drugs (NSAIDs) like ibuprofen, naproxen, and diclofenac, are widely used for everything from headaches and muscle aches to fever and inflammation. Similarly, antibiotics, prescribed for bacterial infections, are often misused for viral illnesses or incomplete courses, contributing to both individual health risks and the larger global crisis of antimicrobial resistance.</p><p>Chronic Kidney Disease is a progressive condition where the kidneys gradually lose their ability to filter waste products from the blood. It's often silent in its early stages but can lead to severe health complications, including kidney failure requiring dialysis or transplantation, cardiovascular disease, and premature death. The CDSCO's direct link between the casual use of these ubiquitous medications and CKD risk brings a critical new dimension to public health discourse, urging both medical professionals and the general public to rethink medication habits.</p><p>This regulatory intervention reflects a global concern about the appropriate use of medicines. While painkillers offer vital relief and antibiotics are life-saving drugs, their misuse carries severe long-term consequences that often go unrecognised until it's too late. The CDSCO\u2019s communication aims to ignite a national conversation about responsible medication practices, emphasizing the importance of medical consultation, adherence to prescribed dosages, and understanding the potential adverse effects even of seemingly harmless drugs. It's a clear directive for greater vigilance from manufacturers, prescribers, and consumers alike to prevent a preventable health crisis.</p>", "compliance_impact": "<ul><li><b>Enhanced Patient and Consumer Awareness:</b> This warning significantly elevates public awareness regarding the risks associated with self-medication and casual use of common drugs. Consumers will likely become more cautious, actively seeking medical advice before starting painkillers or antibiotics, and paying closer attention to dosage and duration, potentially leading to a reduction in preventable kidney damage.</li><li><b>Increased Scrutiny for Healthcare Professionals:</b> Physicians and pharmacists will face renewed emphasis on judicious prescribing practices. This includes thoroughly assessing patient history for kidney risk factors, educating patients on the potential dangers of NSAID and antibiotic misuse, and exploring non-pharmacological pain management options or less nephrotoxic alternatives where appropriate.</li><li><b>Impact on Pharmaceutical Labeling and Marketing:</b> Manufacturers of NSAIDs and antibiotics may face regulatory pressure to review and potentially enhance warning labels, patient information leaflets, and marketing materials. There could be a shift towards clearer, more prominent disclaimers about kidney risks and the importance of adhering to medical advice, moving away from promoting these drugs for casual, long-term use.</li><li><b>Potential Shift in Public Health Strategy:</b> The CDSCO's alert could catalyze broader public health campaigns focused on kidney health and responsible medication use. This might lead to increased investment in preventative health education, early detection of CKD, and strategies to combat antibiotic resistance, ultimately aiming to alleviate the national burden of kidney disease.</li><li><b>Market Dynamics and Innovation:</b> Investors and the pharmaceutical industry might observe a shift in market dynamics, with potential impacts on the sales of certain over-the-counter pain relievers and antibiotics. This could also spur innovation in safer pain management solutions and novel antimicrobial agents, or promote greater emphasis on diagnostics to guide antibiotic prescribing.</li></ul>", "key_actions": "<ul><li><b>For Individuals and Patients:</b> Always consult a doctor or pharmacist before taking painkillers or antibiotics, even if they are available over-the-counter. Strictly follow prescribed dosages and durations, never exceeding them. Avoid self-medicating for recurring pain or infections, and never use antibiotics prescribed for someone else or for viral illnesses.</li><li><b>For Healthcare Professionals:</b> Prioritize a thorough patient assessment, including kidney function and medical history, before prescribing NSAIDs or antibiotics. Engage in clear, empathetic patient education about the risks of misuse, the importance of completing antibiotic courses, and the need for follow-up. Adhere to national and international guidelines for antibiotic stewardship.</li><li><b>For Pharmaceutical Companies:</b> Proactively review and update product labeling to include clearer, more prominent warnings about potential kidney risks, particularly for NSAIDs, and the critical importance of judicious use for all antibiotics. Consider supporting public awareness campaigns that promote responsible medication habits.</li><li><b>For Regulatory Bodies and Policymakers:</b> Continue to monitor drug consumption patterns and adverse event reports related to kidney damage. Implement and reinforce national public health campaigns to educate the general population about medication safety and the dangers of self-medication, working collaboratively with healthcare providers and industry.</li></ul>", "industry_context": "<p>The Central Drugs Standard Control Organisation (CDSCO) serves as India's principal regulatory body for pharmaceuticals and medical devices, akin to the FDA in the United States. Its mandate includes ensuring the quality, safety, and efficacy of drugs available in the country, and its recent advisory reflects a growing global concern about public health. Painkillers, particularly Non-Steroidal Anti-Inflammatory Drugs (NSAIDs), are among the most frequently consumed medications worldwide due to their efficacy in managing pain, fever, and inflammation. Their over-the-counter availability and perceived safety have led to widespread self-medication, often without adequate understanding of potential side effects or proper dosage.</p><p>The mechanism by which NSAIDs can harm kidneys is well-documented. These drugs work by inhibiting prostaglandins, hormone-like compounds that play a crucial role in maintaining healthy kidney function, particularly in situations of stress or dehydration, by regulating blood flow to the kidneys. When prostaglandins are inhibited, blood flow to the kidneys can decrease, potentially leading to acute kidney injury or exacerbating pre-existing chronic kidney conditions. Vulnerable populations, including the elderly, those with high blood pressure, diabetes, heart failure, or pre-existing kidney disease, are at a significantly higher risk.</p><p>While the direct link between indiscriminate antibiotic use and CKD might seem less obvious than with NSAIDs, the connection is insidious and equally critical. Misuse of antibiotics contributes significantly to the global crisis of antimicrobial resistance (AMR), a phenomenon where bacteria evolve to become impervious to existing treatments. This means that common infections become harder to treat, often requiring stronger, broader-spectrum antibiotics that can, in some cases, be directly nephrotoxic or lead to more severe, prolonged illnesses that indirectly strain kidney function. The CDSCO's warning therefore encompasses the broader principle of responsible medication use, where even seemingly disparate drug classes can collectively impact long-term organ health. This regulatory move aligns with global health initiatives, including those by the World Health Organization (WHO), advocating for judicious prescribing and consumption of all medicines to mitigate widespread public health threats.</p>", "seo_title": "India's Drug Regulator Flags Painkiller & Antibiotic Misuse: A Deep Dive into CKD Risks", "seo_description": "CDSCO issues a critical warning against the indiscriminate use of painkillers and antibiotics, highlighting their link to Chronic Kidney Disease. Understand the risks, impact, and responsible medication use.", "primary_company_name": null, "source_url": "https://news.google.com/rss/articles/CBMizAFBVV95cUxPaldNVVJ2VzZDOWozYW5fYWJqdXg0T3YtbmF1bVpoMXQ0Uy1uSEdHX2FMWGZhUHdGMEs0czVvZ1RBMmVKallUenJPeG9ZQUx0NDNCNEluM0RoQmNCczdPOE0tNkFSZGdtdTdiYlF6QkRiR0JVdDlfcmNONUdDSUEzOTRSZExhTXBvUUZmcXlDb3dUS3VBNnpMX2U2cTNtTVZVSGM0X2hIanU2OWhTdGNDdk5uTU9rZVFvUC1aUEdhbVFPMWxBYmRoWWVWYmvSAdIBQVVfeXFMUGY0Zm9mNnpCdlhYUjlmZThUYXM2a2lsUjZwQlZadkdMNEc3cUJGT2dwOGZZU2ZVb2VQT09LV2J4TjNUekNzZF9aTkZpckMtbmhtZXc1bm5FRGo1cUNpRUFwWi1xbXIybVlOaFFjS3k3WkJBVXp2bEV0QTBBNVFrWHp2UGw5d1JGMHE1UTN3dFBpUkMyTGpYWi05eWxfd0IzelVRd250SWtRQlRLUXhPZ1F3LWcwNXFkejNEcWxQM1RtTzdzZ0k2ZG1fNXdta1hDbkt3?oc=5", "fetched_at": "2026-09-22T15:18:38.029797+00:00", "is_long_form": true}, {"id": "76769a106b98", "title": "CDSCO finds one spurious drug sample in Delhi, 220 NSQs in Aug surveillance | India News - Hindustan Times", "slug": "cdsco-finds-one-spurious-drug-sample-in-delhi-220-nsqs-in-aug-surveillance-india-news-hindustan-times", "date": "2026-09-22", "category": "Recall", "severity": "High", "summary": "<p>This is a <b>Featured Article</b> on Zero483.</p><p>A critical alert has been issued from India's Central Drugs Standard Control Organisation (CDSCO), shining a spotlight on persistent challenges in pharmaceutical quality and safety. Recent surveillance efforts for August have brought to light a concerning discovery: one spurious drug sample found in Delhi and a staggering 220 samples identified as 'Not of Standard Quality' (NSQ) across various regions. These findings underscore the continuous vigilance required to protect public health within India, a nation often referred to as the 'pharmacy of the world' due to its vast production and global supply of medicines.</p><p>The term 'spurious drug' is particularly alarming. It refers to medicines that are counterfeit or fake, potentially containing no active pharmaceutical ingredient (API), the wrong API, insufficient API, or even harmful substances. Such drugs are not merely ineffective; they can pose severe health risks, ranging from untreated illnesses to life-threatening adverse reactions. The discovery of a spurious drug in Delhi highlights a critical breach in the supply chain, challenging the integrity of pharmaceutical products available to patients.</p><p>Equally significant, though distinct, are the 'Not of Standard Quality' (NSQ) drugs. Unlike spurious drugs, NSQ medicines are genuine products from legitimate manufacturers, but they fail to meet specified quality standards. This could be due to a variety of issues: incorrect strength (either too high or too low), presence of impurities beyond acceptable limits, inadequate dissolution rates (meaning the drug doesn't release its active ingredient properly in the body), or stability problems that cause it to degrade too quickly. While not outright fakes, NSQ drugs can compromise treatment efficacy, lead to sub-optimal patient outcomes, or even cause harm.</p><p>The sheer number\u2014220 NSQ samples detected in a single month of surveillance\u2014indicates a systemic challenge in ensuring consistent quality across the diverse pharmaceutical landscape. CDSCO's proactive surveillance through its drug testing laboratories plays a vital role in detecting these deviations. These findings serve as a stark reminder of the complexities involved in maintaining drug quality from manufacturing to distribution, emphasizing the paramount importance of robust quality control and regulatory oversight to safeguard patient trust and health in a crucial global pharmaceutical hub.</p>", "compliance_impact": "<ul><li><b>Elevated Patient Risk:</b> Patients face increased danger from ineffective treatments, potential adverse reactions from unknown ingredients in spurious drugs, or sub-optimal outcomes from NSQ medicines, eroding trust in the healthcare system.</li><li><b>Intensified Manufacturer Scrutiny:</b> Pharmaceutical companies in India face heightened regulatory oversight, potential for increased inspections, and pressure to re-evaluate and strengthen their internal quality control systems, supply chain integrity, and compliance with Good Manufacturing Practices (GMP).</li><li><b>Reputational Damage and Market Confidence:</b> Such findings can damage the overall reputation of India's pharmaceutical industry, potentially leading to increased scrutiny from international buyers, impacting export markets, and affecting investor confidence in companies operating within the region.</li><li><b>Increased Regulatory Enforcement:</b> CDSCO and state drug authorities are likely to intensify surveillance, auditing, and enforcement actions, potentially leading to more recalls, stricter penalties for non-compliance, and the implementation of advanced detection and tracing technologies to curb the spread of substandard and spurious drugs.</li><li><b>Strain on Healthcare Infrastructure:</b> The detection and management of spurious or NSQ drugs require significant resources for investigations, product recalls, public health advisories, and potentially re-treatment of affected patients, adding pressure to an already strained healthcare system.</li></ul>", "key_actions": "<ul><li><b>For Patients and Consumers:</b> Always purchase medicines from licensed and reputable pharmacies. Be vigilant about packaging integrity, expiry dates, and product authenticity. Report any suspicious-looking drugs or unexpected adverse reactions to your doctor and the regulatory authorities immediately.</li><li><b>For Pharmaceutical Manufacturers:</b> Invest heavily in robust quality management systems, implement stringent raw material testing, enhance in-process controls, and ensure meticulous final product release testing. Strengthen supply chain security and traceability measures to prevent counterfeiting and diversion.</li><li><b>For Distributors and Retailers:</b> Procure medicines only from verified and authorized manufacturers or legitimate channels. Maintain accurate inventory records and ensure proper storage conditions. Conduct regular checks for product authenticity and report any questionable products to authorities promptly.</li><li><b>For Regulatory Authorities (CDSCO):</b> Continue to enhance surveillance and enforcement capabilities, including investing in advanced drug testing laboratories and technologies. Strengthen inter-agency and international collaboration to combat cross-border counterfeiting and improve information sharing on substandard products.</li><li><b>For Healthcare Providers:</b> Educate patients on the importance of purchasing medicines from reputable sources and how to identify potential warning signs of spurious or substandard drugs. Actively monitor for unusual treatment responses and report any suspected quality issues to the appropriate regulatory body.</li></ul>", "industry_context": "<p>India's pharmaceutical industry stands as a global powerhouse, renowned for its capacity to produce affordable generic medicines that are supplied to countries worldwide. This prestigious position, however, comes with immense responsibility, making the rigorous oversight of the Central Drugs Standard Control Organisation (CDSCO) absolutely critical. CDSCO is India's principal regulatory body for pharmaceuticals and medical devices, tasked with ensuring the safety, efficacy, and quality of medicines circulating within the country and those destined for export. Findings like the spurious drug and the 220 NSQ samples directly impact India's reputation and the trust placed in its pharmaceutical products globally.</p><p>The vast scale and complexity of India's pharmaceutical manufacturing ecosystem present unique challenges. With thousands of manufacturing units, ranging from large multinational corporations to smaller domestic players, maintaining uniform quality standards across the board is a monumental task. Factors contributing to quality issues can include variations in manufacturing practices, challenges in sourcing quality raw materials, the intricacy of supply chains that can be vulnerable to counterfeiting, and economic pressures that sometimes lead to corners being cut. The presence of spurious drugs, in particular, points to criminal activity designed to exploit the demand for medicines, often targeting high-value or essential drugs.</p><p>The therapeutic relevance of this situation is profound. Patients rely on these medicines for everything from managing chronic conditions to treating life-threatening diseases. When drugs are spurious or fail to meet quality standards, the immediate impact on patient health can be severe, leading to treatment failures, progression of disease, or even mortality. This erodes public confidence in the healthcare system and the pharmaceutical industry. For international markets that heavily depend on Indian-manufactured generics, these domestic findings raise legitimate questions about the robustness of the quality assurance mechanisms in place, necessitating transparent and decisive action from Indian regulators.</p><p>Ultimately, these regulatory alerts serve as a crucial feedback loop for the entire industry. They highlight areas where vigilance needs to be intensified, where m  helping to reduce review backlogs and accelerate patient access to vital, lower-cost medications.</p><p>However, the upcoming reauthorization is not merely a procedural formality; it is reportedly being met with 'alleged concerns' regarding the safety and efficacy of generic drugs. These concerns, while often complex and multifaceted, can stem from various sources. They might reflect public perception gaps, isolated post-market adverse events that garner significant media attention, or even broader discussions about the robustness of manufacturing quality control and global supply chain integrity. For the vast majority of FDA-approved generic drugs, the regulatory standard is clear: they must be bioequivalent to their brand-name counterparts, meaning they deliver the same amount of active ingredient at the same rate and extent, ensuring comparable therapeutic effects and safety profiles.</p><p>The reauthorization process provides a crucial opportunity for stakeholders\u2014including patient advocacy groups, pharmaceutical manufacturers, healthcare providers, and policymakers\u2014to evaluate the program's past performance and chart its future course. This often involves intense negotiations and public hearings, where issues such as the speed of reviews, the quality of manufacturing inspections (especially for overseas facilities), the FDA's scientific capabilities, and transparent reporting of generic drug quality metrics are thoroughly debated. The 'alleged concerns' serve as a catalyst for a deeper dive into these areas, potentially leading to new performance goals, refined review standards, or enhanced post-market surveillance requirements within the renewed GDUFA framework.</p><p>Ultimately, the successful reauthorization of GDUFA is paramount for the health of the American public and the stability of its healthcare system. Generic drugs account for nearly 9 out of 10 prescriptions filled in the U.S., offering immense cost savings and broad accessibility to essential therapies. A robust GDUFA ensures that the pipeline of these affordable medicines remains strong, without compromising the rigorous scientific review and oversight that patients depend on. The current discussions underscore the continuous need for trust and transparency in the generic drug market, ensuring that every reauthorization cycle strengthens the program for the benefit of all.</p>", "compliance_impact": "<ul><li><b>Heightened Scrutiny on Manufacturing Quality:</b> Generic drug manufacturers, especially those with global supply chains, may face increased FDA inspection frequency and intensity, with a particular focus on data integrity, facility compliance, and robust quality management systems. This could necessitate significant investments in upgrading manufacturing processes and documentation practices.</li><li><b>Potential for Evolving Performance Metrics:</b> The reauthorization process might introduce new or refined performance goals and metrics for the FDA's generic drug review program. This could impact application approval timelines, post-market surveillance expectations, and the requirements for demonstrating bioequivalence and therapeutic equivalence, especially for complex generic drug products.</li><li><b>Increased Emphasis on Post-Market Surveillance:</b> To address and pre-empt efficacy concerns, there could be a greater focus on post-market activities, including adverse event reporting, real-world evidence collection, and proactive monitoring of generic drug performance once on the market. Manufacturers may need to enhance their pharmacovigilance systems.</li><li><b>Impact on Market Access and Competition:</b> Any changes in GDUFA's requirements or review timelines could influence the speed at which new generic drugs enter the market. This, in turn, can affect market competition, drug pricing dynamics, and ultimately, patient access to affordable medications.</li><li><b>Investor and Public Confidence:</b> Perceived issues, even if alleged, can erode public and investor confidence in generic drugs. Manufacturers will need to demonstrate their unwavering commitment to quality and transparency to maintain trust and ensure continued market stability.</li></ul>", "key_actions": "<ul><li><b>For Generic Drug Manufacturers:</b> Proactively review and reinforce your quality management systems, data integrity protocols, and global supply chain oversight. Engage with industry associations to stay informed about proposed GDUFA changes and prepare to adapt to new regulatory expectations and performance goals.</li><li><b>For Patients and Consumers:</b> Educate yourself on the rigorous FDA approval process for generic drugs. If you have concerns about a specific medication, speak with your healthcare provider or pharmacist, who can provide accurate information and reassurance regarding the quality and efficacy of FDA-approved generics.</li><li><b>For Healthcare Providers:</b> Stay updated on the outcomes of the GDUFA reauthorization and any changes to generic drug approval or post-market monitoring processes. Be prepared to effectively communicate the safety and efficacy of generic medications to your patients, addressing any misinformation or concerns they may have.</li><li><b>For Investors and Industry Stakeholders:</b> Closely monitor the GDUFA reauthorization negotiations and the final legislative text. Understand how potential changes in regulatory oversight or review timelines could impact generic drug market dynamics, manufacturing costs, and specific company valuations to make informed strategic decisions.</li></ul>", "industry_context": "<p>The generic drug industry forms the backbone of affordable healthcare globally, and particularly in the United States. Generic medicines save the U.S. healthcare system hundreds of billions of dollars annually, making vital treatments accessible to millions. These drugs are pharmaceutical equivalents to their brand-name counterparts, meaning they contain the same active ingredient, are identical in strength, dosage form, and route of administration, and meet the same quality and purity standards. Crucially, before a generic drug can be marketed, the U.S. Food and Drug Administration (FDA) requires extensive testing to demonstrate bioequivalence, proving that the generic delivers the same amount of active drug into a patient\u2019s bloodstream in the same amount of time as the original brand-name drug.</p><p>Historically, the FDA's generic drug review process faced significant challenges, including a substantial backlog of applications that delayed patient access to affordable medicines. This led to the creation of the Generic Drug User Fee Amendment (GDUFA) in 2012. GDUFA revolutionized the system by enabling the FDA to collect user fees from generic drug manufacturers to fund a more efficient and predictable review process. This funding has allowed the agency to hire more scientific staff, invest in advanced technology, and improve its inspection capabilities, particularly for the global manufacturing sites that produce a significant portion of generic drugs.</p><p>The continuous reauthorization of GDUFA every five years reflects an ongoing dialogue between the FDA, industry, and the public. Each cycle addresses emerging issues, adapts to scientific advancements, and aims to further streamline the review process while maintaining strict oversight. The current 'alleged concerns of safety and efficacy' during this reauthorization period highlight the inherent tension in this system: the public's desire for immediate access to affordable drugs, coupled with an unwavering expectation of unimpeachable quality and safety. While the FDA's scientific review is robust, public perception can be influenced by isolated events, misinformation, or a lack of understanding about the stringent approval process for generics, underscoring the importance of clear communication and continuous regulatory vigilance.</p>", "seo_title": "GDUFA Reautho   function applyFilters() {
    const q = searchQuery.toLowerCase().trim();
    const filtered = allItems.filter(item => {
      const matchCat = activeFilter === 'All' || item.category === activeFilter;
      if (!matchCat) return false;
      if (!q) return true;
      return (
        (item.title  || '').toLowerCase().includes(q) ||
        (item.summary|| '').toLowerCase().includes(q)
      );
    });
    renderFeed(filtered);
  }

  function init() {
    if (INJECTED_DATA && INJECTED_DATA.items) {
      allItems = INJECTED_DATA.items.filter(i => ['Recall', 'Drug Shortage', 'Adverse Event'].includes(i.category));
      
      const params = new URLSearchParams(window.location.search);
      if (params.has('q')) {
        searchQuery = params.get('q');
        searchInput.value = searchQuery;
      }
      
      applyFilters();
      
      // Initialize Ticker
      const tickerWrap = document.getElementById('z483-ticker-wrap');
      const tickerContent = document.getElementById('z483-ticker-content');
      if (tickerWrap && tickerContent && allItems.length > 0) {
        const top5 = allItems.slice(0, 5);
        let tHtml = top5.map(i => `<a href="${escHtml(i.source_url)}" target="_blank" class="z483-ticker-item">${escHtml(stripHtml(i.title))}</a>`).join(' &bull; ');
        tickerContent.innerHTML = tHtml + ' &bull; ' + tHtml; // Duplicate for seamless scroll
        tickerWrap.style.display = 'flex';
      }
    } else {
      feed.innerHTML = `
        <div class="z483-state">
          <h3>No Data Available</h3>
          <p>Please run the python script to inject data.</p>
        </div>`;
    }
  }

  // Fallback data for local preview if no injected data
  if (!INJECTED_DATA) {
    setTimeout(() => {
      // If still null, just clear
      if (!allItems.length) {
        init();
      }
    }, 100);
  } else {
    init();
  }

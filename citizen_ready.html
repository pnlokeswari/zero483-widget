uperpotent.' In simple terms, 'superpotent' means that the medication contains a higher concentration of the active pharmaceutical ingredient than intended or stated on the label. For a drug like thyroid medication, which requires incredibly precise dosing, such a deviation is not just a minor manufacturing glitch; it presents a significant and immediate health risk to patients.</p><p>Patients who inadvertently consume these superpotent tablets are at risk of developing hyperthyroidism, a condition caused by an overactive thyroid gland. Symptoms can range from mild discomfort to severe, life-threatening complications. These may include rapid or irregular heartbeat (tachycardia or arrhythmias), tremors, anxiety, insomnia, excessive sweating, unintended weight loss, heat intolerance, and even fatigue or muscle weakness. For vulnerable populations, such as the elderly, individuals with pre-existing heart conditions, or those who have been on the medication for an extended period, the consequences of sudden exposure to an excessive dose could be particularly severe, potentially leading to cardiac events, bone density loss, or a thyroid storm.</p><p>This recall underscores the FDA's unwavering commitment to public health and safety. While the specific manufacturer or brand details were not immediately prominent in the initial alert, the widespread nature of a 'nationwide' recall signals the gravity of the situation. Regulatory actions like these are initiated when the potential for serious adverse health consequences is significant. The FDA works with manufacturers to identify affected batches, ensure proper notification, and facilitate the removal of these products from the market to protect consumers. Patients currently taking thyroid medication are strongly advised to remain vigilant and follow guidance from their healthcare providers.</p><p>For patients, the most crucial takeaway is not to panic, but to act judiciously. Abruptly stopping thyroid medication without medical guidance can also lead to adverse effects, as the body depends on a consistent supply of these hormones. Therefore, patients should not discontinue their medication before consulting with their doctor or pharmacist. Instead, they should verify if their specific prescription is part of the recalled batches and seek professional advice on how to proceed safely. This typically involves checking the lot number and expiration date on their medication bottle against recall notices and discussing alternative treatment plans with their healthcare provider.</p>", "compliance_impact": "<ul><li><b>Elevated Patient Safety Risk:</b> Individuals consuming superpotent tablets face the immediate danger of hyperthyroidism, potentially leading to serious cardiovascular events, bone density issues, and other severe health complications, particularly for vulnerable patient populations.</li><li><b>Increased Burden on Healthcare Systems:</b> Healthcare providers, including physicians and pharmacists, must dedicate significant resources to identify affected patients, communicate recall information, manage potential adverse reactions, and facilitate safe medication switches, adding strain to an already busy system.</li><li><b>Erosion of Public Trust:</b> Recalls, especially for widely used and critical medications like thyroid hormones, can significantly undermine public confidence in pharmaceutical manufacturers and the regulatory oversight bodies, making patients more hesitant about their prescribed treatments.</li><li><b>Disruption to Supply Chains and Market:</b> Depending on the scale of the recall, there could be temporary shortages of specific dosages or generic alternatives, leading to inconvenience for patients and logistical challenges for pharmacies to source compliant replacements.</li><li><b>Heightened Regulatory Scrutiny:</b> The involved manufacturer will face intense scrutiny, potentially leading to further FDA inspections, enforcement actions, and significant financial penalties. This can also prompt broader regulatory attention on other manufacturers within the therapeutic class to ensure similar quality issues are not pervasive.</li></ul>", "key_actions": "<ul><li><b>For Patients:</b> Immediately check your thyroid medication bottles for lot numbers and expiration dates against any official recall announcements. Do NOT stop taking your medication abruptly. Contact your prescribing physician or pharmacist without delay for guidance on how to proceed, obtain a new prescription if necessary, and safely manage your medication.</li><li><b>For Pharmacists and Healthcare Providers:</b> Promptly identify any recalled batches within your inventory. Proactively reach out to patients who may have received the affected medication, provide clear instructions for return or disposal, and facilitate the transition to a compliant alternative. Be prepared to address patient concerns and manage potential adverse reactions.</li><li><b>For Pharmaceutical Manufacturers:</b> Conduct a thorough internal investigation into the root cause of the superpotency. Review and reinforce all aspects of your Quality Management System, focusing on raw material testing, in-process controls, finished product testing, and batch release procedures to prevent recurrence and ensure strict adherence to cGMP.</li><li><b>For Investors and Industry Observers:</b> Monitor further FDA updates regarding this recall and its broader implications for the pharmaceutical sector. Evaluate the potential impact on companies within the thyroid medication market and assess the overall emphasis on quality control and regulatory compliance as a key performance indicator.</li></ul>", "industry_context": "<p>Thyroid hormones play a fundamental role in regulating metabolism, energy levels, heart function, and virtually every system in the human body. Millions of people worldwide suffer from hypothyroidism, an underactive thyroid gland, which necessitates lifelong replacement therapy with synthetic thyroid hormones. Levothyroxine, a synthetic form of the T4 hormone, is the most commonly prescribed medication for this condition and is considered a cornerstone therapy for its efficacy and safety when dosed correctly. Its widespread use makes any quality issue incredibly impactful.</p><p>The therapeutic index of thyroid medications is notoriously narrow. This means there is a very small difference between an effective dose and a dose that can cause adverse effects. Patients often require highly individualized dosing, with even microgram adjustments making a significant difference in their physiological response. Therefore, a tablet being 'superpotent' \u2014 containing even slightly more active ingredient than labeled \u2014 can push a patient from a stable, euthyroid state into a hyperthyroid state. This delicate balance highlights why precision in manufacturing and stringent quality control are not just regulatory requirements but absolute necessities for patient safety.</p><p>For the pharmaceutical industry, this recall serves as a stark reminder of the critical importance of robust quality management systems and adherence to current Good Manufacturing Practices (cGMP). Manufacturing thyroid medications, like many other potent drugs, involves complex processes where variations in raw materials, mixing, compression, and coating can all influence the final product's potency and uniformity. Any lapse in these control points, from ingredient sourcing to final batch release testing, can have dire consequences, leading to recalls, significant financial losses, and irreparable damage to a company's reputation and public trust.</p><p>Such incidents also ripple beyond the immediate manufacturer. They can trigger increased scrutiny from regulatory bodies like the FDA on other manufacturers of similar products, potentially leading to broader industry audits and tighter controls. This continuous vigilance by regulators aims to ensure that the medications patients rely on are consistently safe, effective, and of the highest quality, reinforcing the global commitment to pharmaceutical integrity.</p>", "seo_title": "FDA Issues Nationwide Recall: 'Superpotent' Thyroid Medication Poses Serious Health Risk", "seo_description": "A nationwide recall of thyroid medication is underway due to superpotent tablets, posing significant health risks. Learn why this FDA action matters for patients and the industry.", "primary_company_name": null, "source_url": "https://news.google.com/rss/articles/CBMiogFBVV95cUxPazFOU3lWdlJINHNycUZyLTFMeVEyd1B0bUlYcTR1SVd1Q3NyY3Z5VUtNNWwxQnVYLWVLek53YU9JMURQZHZjWUVuWFY0N1MtMkVMbjlhN3pGRUFNN21NeTllSkJuTF9hU2NBTzZfbU9SdVRzMU1tRnA1WF9YY2g4QVNWdDN0OHV2MDBNUGlVUlc0Q2FDeXIxZERKTExUMFV1Z3fSAacBQVVfeXFMTzQwZGZRQ0Yyb0NkRkFaRkxMU1ZzVGlxUW44bWM4SWNVZW5lbHFkWHh0UE14OFRXdGpFeU16cW55Q25sMFA1NTFtVG45Q3k3aV9haS1JamxEdWdtazFlSWljd1JYdHVLeFlzT1RxUEJCSGttaHNsWmdhYzR6QlA4d0h2alJmRnFtbXFUMGx5QTQ2QzNmaVZ0YlZVWFNQV3N6NHM2RjJLenM?oc=5", "fetched_at": "2026-08-26T02:16:34.125701+00:00", "is_long_form": true}, {"id": "4368c69dcadd", "title": "New Jazz cancer drug approval could drive blockbuster sales - BioPharma Dive", "slug": "new-jazz-cancer-drug-approval-could-drive-blockbuster-sales-biopharma-dive", "date": "2026-08-25", "category": "Drug Approval", "severity": "Low", "summary": "<p>Title: New Jazz cancer drug approval could drive blockbuster sales - BioPharma Dive\nSource: Google News\nDate: Tue, 25 Aug 2026 21:22:38 GMT</p>", "compliance_impact": "<ul><li>Review the details of this regulatory action to assess potential public or market implications.</li></ul>", "key_actions": "<ul><li>Discuss this update with relevant team members or advisors to evaluate next steps.</li></ul>", "industry_context": "", "seo_title": "New Jazz cancer drug approval could drive blockbuster sales - BioPharma Dive", "seo_description": "", "primary_company_name": null, "source_url": "https://news.google.com/rss/articles/CBMioAFBVV95cUxPRG5OTjljUXRJ cuss this update with relevant team members or advisors to evaluate next steps.</li></ul>", "industry_context": "", "seo_title": "LIST: Here's all the food under recall in the US - WUSA9", "seo_description": "", "primary_company_name": null, "source_url": "https://news.google.com/rss/articles/CBMi2wFBVV95cUxQU2FobmpaY3p1SlFxZ1UzZnNIbGE2UlA4T3AwN2xRODgwc0EtNC1pbVZwTEU1cUNyMGVVQi03anhYMXVPTVluVnVGanlXRXR4Yzh1SFhxNDNRbDctZndpbjdrYnVWMGpFUFhqZVF4QU5iRWhlRndqS3dyRGtIZnZnRXNHZFZIb2lYVmFNbXpmMlVzOXZnRXlweG5YbW9qRnR3WkJYODhXdTJZbEFheTkwUEJ2WkxuMnV2QlFFRFUzeTN1MEZoaGQ5RlAxWUZJWWpBczNlblZ3NzhhUXc?oc=5", "fetched_at": "2026-08-25T05:24:09.243013+00:00", "is_long_form": false}, {"id": "2ffb2815ace2", "title": "FDA logs more than 1,700 adverse event reports involving compounded semaglutide and tirzepatide - drugdiscoverytrends.co", "slug": "fda-logs-more-than-1-700-adverse-event-reports-involving-compounded-semaglutide-and-tirzepatide-drugdiscoverytrends-co", "date": "2026-08-24", "category": "Drug Shortage", "severity": "Medium", "summary": "<p>This **Featured Article** on Zero483 delves into a significant US FDA regulatory update that has sent ripples across the healthcare landscape: the agency has logged more than 1,700 adverse event reports involving compounded versions of semaglutide and tirzepatide. These groundbreaking medications, widely known by their brand names like Ozempic, Wegovy, Mounjaro, and Zepbound, have revolutionized the treatment of type 2 diabetes and chronic weight management. However, the surge in demand and subsequent supply challenges for the FDA-approved products inadvertently created a perilous grey market for compounded alternatives, leading to serious safety concerns.</p><p>The sheer volume of adverse event reports underscores a critical public health warning. While compounding pharmacies serve a vital role in creating customized medications for patients with unique medical needs\u2014such as allergies to specific inactive ingredients or requirements for different dosage forms\u2014their operations exist in a different regulatory sphere than traditional pharmaceutical manufacturers. The FDA-approved versions of semaglutide and tirzepatide undergo rigorous testing for safety, efficacy, purity, and potency before reaching patients. Compounded versions, however, are not subject to the same stringent pre-market approval process.</p><p>A primary concern revolves around the active pharmaceutical ingredients (APIs) used by compounding pharmacies. The FDA has repeatedly warned against the use of semaglutide sodium or other salt forms, which are not the same active ingredient as in the approved drugs and have not been evaluated for safety and efficacy. These unapproved ingredients, often sourced from unregulated suppliers, pose significant risks of impurities, variable potency, and a lack of sterility, especially for injectable formulations. Patients using these compounded drugs may not receive the intended therapeutic benefit or, worse, could experience dangerous side effects.</p><p>The over 1,700 reported adverse events are not just statistics; they represent real patients experiencing a range of issues, from gastrointestinal disturbances and allergic reactions to more severe, potentially life-threatening complications. This situation highlights the inherent dangers when unapproved, unregulated products mimic vital medications. The FDA's ongoing monitoring and public warnings are a clear signal that the agency views the proliferation of these compounded versions as a serious threat to patient safety and public health, necessitating immediate and informed action from all stakeholders.</p>", "compliance_impact": "<ul><li><strong>Significant Patient Safety Risks:</strong> The most critical impact is the direct harm to patients, ranging from ineffective treatment and exacerbated underlying conditions to severe adverse reactions due to impurities, incorrect dosing, or unapproved ingredients in compounded products. This erodes trust in both the legitimate compounding industry and pharmaceutical innovations.</li><li><strong>Heightened Regulatory Scrutiny on Compounding:</strong> The FDA's logging of numerous adverse events will inevitably lead to increased oversight, enforcement actions, and potential policy changes affecting compounding pharmacies. State boards of pharmacy will also face pressure to ensure strict adherence to compounding regulations, potentially leading to increased inspections and penalties for non-compliant facilities.</li><li><strong>Market Confusion and Brand Dilution:</strong> The proliferation of compounded versions creates confusion in the market, making it difficult for patients and prescribers to differentiate between legitimate, FDA-approved medications and potentially unsafe alternatives. This can dilute the brand integrity and market position of the original manufacturers and their approved products.</li><li><strong>Legal and Professional Liability:</strong> Healthcare providers, including physicians and pharmacists, face increased legal and professional liability when prescribing or dispensing compounded semaglutide and tirzepatide. They must navigate the ethical dilemmas of patient demand versus regulatory warnings and the potential for adverse outcomes.</li><li><strong>Supply Chain and Manufacturing Pressure:</strong> The original manufacturers of GLP-1 agonists will continue to face pressure to address supply chain shortages and increase production to meet demand, thereby reducing the reliance on compounded alternatives. This incident serves as a stark reminder of the critical balance between innovation, access, and regulatory compliance in the pharmaceutical industry.</li></ul>", "key_actions": "<ul><li><strong>For Patients and Consumers:</strong> Always prioritize FDA-approved medications prescribed by your healthcare provider. If considering compounded versions, have an open and detailed discussion with your doctor about the specific reasons, the source of the compounded drug, and potential risks. Verify that any compounded medication is truly necessary for a specific medical need not met by approved drugs.</li><li><strong>For Prescribing Clinicians:</strong> Exercise extreme caution when considering compounded GLP-1 receptor agonists. Ensure you are well-informed about the FDA's warnings and the specific regulatory status of the ingredients being used. Only prescribe compounded versions if there is a clear, individualized patient need that cannot be met by FDA-approved products, and ensure the compounding pharmacy is reputable and compliant with all state and federal regulations.</li><li><strong>For Compounding Pharmacies:</strong> Adhere strictly to all state and federal regulations governing compounding. Prioritize patient safety by using only high-quality, FDA-approved bulk drug substances where available and appropriate. Avoid compounding drugs that are essentially copies of commercially available, FDA-approved products, especially when not for specific, individualized patient needs. Robust quality control and sterility assurance are paramount.</li><li><strong>For Pharmaceutical Manufacturers:</strong> Continue efforts to ramp up production and stabilize the supply chain for FDA-approved GLP-1 receptor agonists to meet the unprecedented demand. Engage in clear and consistent patient and prescriber education campaigns to highlight the safety and efficacy of approved products versus the risks of compounded alternatives.</li><li><strong>For Regulatory Bodies (e.g., State Boards of Pharmacy):</strong> Increase surveillance and enforcement actions against non-compliant compounding pharmacies that are operating outside the legitimate scope of compounding, particularly concerning drugs with FDA-approved commercial equivalents. Enhance public awareness campaigns on the dangers of unapproved compounded medications.</li></ul>", "industry_context": "<p>Semaglutide and tirzepatide belong to a class of drugs known as incretin mimetics, specifically GLP-1 receptor agonists (with tirzepatide also activating GIP receptors). Their therapeutic impact has been nothing short of transformative for millions worldwide. Initially approved for type 2 diabetes, their remarkable efficacy in promoting significant weight loss led to subsequent approvals for chronic weight management. This dual benefit, coupled with compelling clinical trial data, fueled unprecedented demand, often outstripping the supply capabilities of manufacturers like Novo Nordisk and Eli Lilly. This scarcity created a vacuum, which many compounding pharmacies sought to fill, often marketing their products as more affordable or readily available alternatives.</p><p>The role of compounding pharmacies is traditionally to prepare personalized medications for individual patients when an FDA-approved drug is not suitable or available. This can include reformulating a drug without an allergen, preparing a liquid form for a child, or creating a specific dose not commercially manufactured. However, the regulatory framework differentiates between traditional compounding (regulated under Section 503A of the Federal Food, Drug, and Cosmetic Act by state boards of pharmacy) and outsourcing facilities (registered under Section 503B with the FDA, subject to stricter Good Manufacturing Practices, but still not requiring pre-market approval for each compounded product). The current issue with semaglutide and tirzepatide largely falls into a grey area where compounding extends beyond individualized patient needs to essentially replicate commercially available, FDA-approved drugs in a less regulated environment, often using unapproved bulk drug substances.</p><p>The FDA has been proactive in issuing warnings regarding compounded semaglutide and tirzepatide, emphasizing that these versions do not carry the agency's stamp of approval for safety, quality, or efficacy. The core problem lies in the use of unapproved ingredients, the lack of robust quality control systems akin to those in large pharmaceutical manufacturing, and the potential for mislabeling or incorrect dosing. This regulatory update underscores the ongoing tension between patient access, drug pricing, and the imperative for patient safety and product integrity, ultimately challenging the ethical boundaries and regulatory oversight of compounding practices, especially when commercially available alternatives exist.</p>", "seo_title": "FDA Sounds Alarm: 1,700+ Adverse Events Linked to Compounded Semaglutide & Tirzepatide", "seo_description": "The FDA has reported over 1,700 adverse events from compounded GLP-1 drugs like semaglutide and tirzepatide. Uncover the risks, regulatory warnings, and what this means for patient safety and the pharmaceutical market.", "primary_company_name": null, "source_url": "https://news.google.com/rss/articles/CBMiywFBVV95cUxQeXhya1BXcG56YXdDSHF1RE1HdnBQMVlUN1RNQlVfanpJenZsSWs2YzNqUzV0eVZFeFhhQktPNldsUUhsYmtqaXlkS2w1NUVMc2lZRUZvN1FUTW9Wb2VIWTdrdndUUW5uRlJCS1VnbGh6TGs5VndIWEt0LXhVMjdHd292UGllWno2Mk5vODgxbC0wU1hJUkd3VnZ5VW11eFlzcDRocHU0d3o0TGI1VDYwaC1zVEczazFfQ05JQ3RiNmo1czR1Uk8ybUVhTQ?oc=5", "fetched_at": "2026-08-25T03:33:37.638875+00:00", "is_long_form": true}, {"id": "a242f6578abc", "title": "Drug Shortage: Bumetanide Injection", "slug": "drug-shortage-bumetanide-injection", "date": "2026-08-24", "category": "Drug Shortage", "severity": "Medium", "summary": "<p>Generic name: Bumetanide Injection\nBrand name: N/A\nStatus: Current\nPresentations: []</p>", "compliance_impact": "<ul><li>Review the details of this regulatory action to assess potential public or market implications.</li></ul>", "key_actions": "<ul><li>Discuss this update with relevant team members or advisors to evaluate next steps.</li></ul>", "industry_context": "", "seo_title": "Drug Shortage: Bumetanide Injection", "seo_description": "", "primary_company_name": null, "source_url": "https://www.accessdata.fda.gov/scripts/drugshortages/default.cfm     if (text.length <= maxLength) return text;
    return text.substring(0, maxLength).trim() + '...';

              <button class="z483-share-btn z483-share-fb" data-title="${escHtml(item.title)}" onclick="shareFacebook(event, this)" aria-label="Share on Facebook" title="Share on Facebook">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
              </button>
              <button class="z483-share-btn z483-share-tw" data-title="${escHtml(item.title)}" onclick="shareTwitter(event, this)" aria-label="Share on Twitter" title="Share on Twitter">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>
              </button>
              <button class="z483-share-btn z483-share-mail" data-title="${escHtml(item.title)}" onclick="shareEmail(event, this)" aria-label="Share via Email" title="Share via Email">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              </button>
            </div>
            <div style="display: flex; gap: 16px; align-items: center;">
              <a href="https://alerts.zero483.com/alerts/${escHtml(item.slug)}.html" target="_blank" onclick="event.stopPropagation();" style="font-size: 0.9rem; font-weight: 600; color: var(--z-text-muted); text-decoration: none; transition: color var(--z-transition);" onmouseover="this.style.color='var(--z-accent)'" onmouseout="this.style.color='var(--z-text-muted)'">
                ${item.is_long_form ? '⭐ Zero483 Analysis' : 'Zero483 Analysis'}
              </a>
              <a class="z483-read-link" href="${escHtml(item.source_url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">
                Read Full Article
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
              </a>
            </div>
          </div>
        </div>`;
    }).join(' &bull; ');
  }

  function applyFilters() {
    const q = searchQuery.toLowerCase().trim();
    const filtered = allItems.filter(item => {
      const matchCat = activeFilter === 'All' || item.category === activeFilter;
      if (!matchCat) return false;
      if (!q) return true;
      return (
        (item.title  || '').toLowerCase().includes(q) ||
        (item.summary|| '').toLowerCase().includes(q)
      );
    });
    renderFeed(filtered);
  }

  function init() {
    if (INJECTED_DATA && INJECTED_DATA.items) {
      allItems = INJECTED_DATA.items.filter(i => ['Recall', 'Drug Shortage', 'Adverse Event'].includes(i.category));
      
      const params = new URLSearchParams(window.location.search);
      if (params.has('q')) {
        searchQuery = params.get('q');
        searchInput.value = searchQuery;
      }
      
      applyFilters();
      
      // Initialize Ticker
      const tickerWrap = document.getElementById('z483-ticker-wrap');
      const tickerContent = document.getElementById('z483-ticker-content');
      if (tickerWrap && tickerContent && allItems.length > 0) {
        const top5 = allItems.slice(0, 5);
        let tHtml = top5.map(i => `<a href="${escHtml(i.source_url)}" target="_blank" class="z483-ticker-item">${escHtml(stripHtml(i.title))}</a>`).join(' &bull; ');
        tickerContent.innerHTML = tHtml + ' &bull; ' + tHtml; // Duplicate for seamless scroll
        tickerWrap.style.display = 'flex';
      }
    } else {
      feed.innerHTML = `
        <div class="z483-state">
          <h3>No Data Available</h3>
          <p>Please run the python script to inject data.</p>
        </div>`;
    }
  }

  // Fallback data for local preview if no injected data
  if (!INJECTED_DATA) {
    setTimeout(() => {
      // If still null, just clear
      if (!allItems.length) {
        init();
      }
    }, 100);
  } else {
    init();
  }

</script>

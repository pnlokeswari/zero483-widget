<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Pinterest & SEO Meta Tags -->
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:image" content="{{IMAGE_URL}}" />
  <meta property="og:type" content="article" />
  <meta name="pinterest-rich-pin" content="true" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --text-main: #333333;
      --text-muted: #777777;
      --accent: #E60023; /* Pinterest Red */
      --accent-hover: #ad081b;
      --border: #eae8e1;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Lato', sans-serif;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      line-height: 1.2;
      margin-bottom: 15px;
      color: #1a1a1a;
    }

    .meta {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .hero-image-container {
      position: relative;
      margin-bottom: 40px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .hero-image-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Pinterest Pin Button Overlay */
    .pin-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: var(--accent);
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
    }

    .hero-image-container:hover .pin-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .pin-btn:hover {
      background-color: var(--accent-hover);
    }

    .content {
      background: var(--surface);
      padding: 50px 60px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.02);
      border: 1px solid var(--border);
    }

    .content h2, .content h3 {
      font-family: 'Playfair Display', serif;
      color: #1a1a1a;
      margin-top: 40px;
    }

    .content h2 { font-size: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .content p { font-size: 1.1rem; margin-bottom: 25px; }

    /* Affiliate Button */
    .affiliate-btn {
      display: inline-block;
      background-color: var(--text-main);
      color: white;
      text-decoration: none;
      padding: 15px 35px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: bold;
      margin: 30px 0;
      text-align: center;
      transition: background 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .affiliate-btn:hover {
      background-color: #555;
    }
    
    .buy-box {
      background: #fdfaf6;
      border: 1px dashed #d5d1c8;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      margin: 40px 0;
    }

    @media (max-width: 768px) {
      .content { padding: 30px 20px; }
      h1 { font-size: 2.2rem; }
      .pin-btn { opacity: 1; transform: translateY(0); } /* Always show on mobile */
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="meta">{{CATEGORY}} • {{DATE}}</div>
      <h1>{{TITLE}}</h1>
    </header>

    <div class="hero-image-container">
      <img src="{{IMAGE_URL}}" alt="{{TITLE}}" />
      <a href="https://pinterest.com/pin/create/button/?url={{PAGE_URL}}&media={{IMAGE_URL}}&description={{TITLE}}" class="pin-btn" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.372 0 12c0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.439.219-.937 1.406-5.957 1.406-5.957s-.359-.72-.359-1.781c0-1.663.967-2.911 2.168-2.911 1.024 0 1.518.769 1.518 1.688 0 1.029-.653 2.567-.992 3.992-.285 1.193.6 2.165 1.775 2.165 2.128 0 3.768-2.245 3.768-5.487 0-2.861-2.063-4.869-5.008-4.869-3.41 0-5.409 2.562-5.409 5.199 0 1.033.394 2.143.889 2.741.099.12.112.225.085.345-.09.375-.293 1.199-.334 1.363-.053.225-.172.271-.401.165-1.495-.69-2.433-2.878-2.433-4.646 0-3.776 2.748-7.252 7.92-7.252 4.163 0 7.398 2.967 7.398 6.923 0 4.135-2.607 7.462-6.233 7.462-1.214 0-2.354-.629-2.758-1.379l-.749 2.848c-.269 1.045-1.004 2.352-1.498 3.146 1.123.345 2.306.535 3.55.535 6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12z"/></svg>
        Save
      </a>
    </div>

    <main class="content">
      {{CONTENT}}
    </main>
  </div>

  <!-- Pinterest Embed Script -->
  <script async defer src="//assets.pinterest.com/js/pinit.js"></script>
</body>
</html>

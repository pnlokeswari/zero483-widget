ion over a labeling issue. Learn what this means for patient safety and regulatory compliance.", "primary_company_name": "Otsuka JV", "source_url": "https://news.google.com/rss/articles/CBMipwFBVV95cUxPeDhUU0ZheWZlNFNYRTUxaFVvbUsxWVNvRU5PckJEbzBpRjhsbHhtUGp4M1NOeEdKN3FBeXBwYnprYnhDN3hQaXZPSTZ4UG9SWlF4dS1ZdWF2eGpwV3B3WGcxYjF5QTZZN01ib2pPYl8yR0hBcl9feERySE1IQ085dlNNcEFWT0JjbzlaZV8yYmpMbUlpeUtKakJYdl9ZRDN3TDhsb3dPVQ?oc=5", "fetched_at": "2026-09-24T17:34:50.952801+00:00", "is_long_form": false}, {"id": "9e92466b8319", "title": "Thyroid medicine recall receives FDA's highest risk level - USA Today", "slug": "thyroid-medicine-recall-receives-fda-s-highest-risk-level-usa-today", "date": "2026-09-24", "category": "Recall", "severity": "High", "summary": "<p>The U.S. FDA has designated a recent recall of a thyroid medication as Class I, its most serious category. This classification indicates that using the affected drug carries a reasonable probability of severe health consequences or even death, highlighting critical concerns regarding product quality and patient safety.</p>", "compliance_impact": "<ul><li>Manufacturers face heightened scrutiny over quality control and production consistency for life-sustaining medicines.</li><li>This incident underscores the critical importance of robust regulatory oversight in protecting patient health.</li></ul>", "key_actions": "<ul><li>Patients: Consult your healthcare provider immediately if you are using affected thyroid medicine.</li><li>Industry: Reinforce stringent quality controls and regulatory adherence to prevent serious recall events.</li></ul>", "industry_context": "<p>Thyroid hormone replacement drugs like levothyroxine are vital for millions managing hypothyroidism, where precise, consistent dosing is paramount for metabolic health and preventing serious symptoms.</p>", "seo_title": "Urgent FDA Class I Recall: Thyroid Medication Receives Highest Risk Level", "seo_description": "The FDA has issued a Class I recall for a thyroid medicine, signifying serious health risks. Learn why consistent dosage is critical for patient safety.", "primary_company_name": null, "source_url": "https://news.google.com/rss/articles/CBMiygFBVV95cUxObXhfd3pzVXlLN1QzUl9NQl92RlhpaXNHMTdUYXg0Z3lUYUdGWkZSZTY3VHEzVFU3dVNXWU00MjBWLWhDV3E3dXZRenJEb2RsMmZSelVKdEZBRV9wRUozVnlJaWZOSWdGd2xlUnk2VE03TFhxN2xWenVxc2s5OGxPZ29paUNoTGJIRW1IOUU5Z3lKYVZUVFN4TXZxcnJOc0JYNHJRTDBuTU1SdVVBTUhKWEZBc1lNOHVCYkczeEhFS0RwQ3lEdk1MdUNB?oc=5", "fetched_at": "2026-09-24T17:34:37.966337+00:00", "is_long_form": false}, {"id": "dd8822dfa9df", "title": "InterStim\u2122 Systems", "slug": "interstim-systems", "date": "2026-09-24", "category": "Recall", "severity": "High", "summary": "<p><b>Featured Article</b> on Zero483: The world of medical devices, while offering life-changing solutions, also demands rigorous oversight and continuous vigilance. In a recent development, the US Food and Drug Administration (FDA) has issued a significant safety communication regarding certain models of Medtronic\u2019s InterStim\u2122 Systems. While the initial alert may have originated through broader global surveillance, including insights from regulatory bodies like Health Canada, the FDA is now actively addressing potential concerns within the U.S. market, highlighting the agency's commitment to patient safety and post-market device performance. This update underscores the complexities inherent in managing long-term implantable devices and the collaborative effort required between manufacturers, regulators, and healthcare providers.</p><p>InterStim\u2122 Systems are groundbreaking implantable medical devices designed to help individuals regain control over their bladder and bowel functions. Specifically, these neurostimulators target conditions such as overactive bladder (OAB), urinary retention, and fecal incontinence \u2013 debilitating issues that significantly impact quality of life for millions. By delivering mild electrical pulses to the sacral nerves, the system helps to restore normal communication between the brain and the bladder or bowel, providing substantial relief where conventional treatments have failed. For many patients, the InterStim system has been a beacon of hope, allowing them to resume daily activities without the constant worry of incontinence.</p><p>The specific concern outlined in this recent communication centers around a reported increase in instances of unanticipated battery depletion and, in some cases, connector pin corrosion within a particular subset of InterStim\u2122 Micro and InterStim\u2122 II models manufactured between January 2022 and June 2024. While Medtronic, the device manufacturer, has emphasized that these issues do not pose an immediate life-threatening risk, they can lead to an abrupt cessation of therapy, requiring unscheduled surgical intervention for device replacement. This not only disrupts the patient's treatment regimen but also carries the inherent risks associated with additional surgical procedures. The FDA\u2019s communication serves as a crucial heads-up to clinicians and patients to be aware of these potential issues and to monitor device performance closely.</p><p>The FDA's proactive stance reflects its dedication to ensuring the continued safety and efficacy of medical devices post-market. The agency is currently working closely with Medtronic to further investigate the root causes of these reported issues, assess the full scope of affected devices, and develop appropriate corrective actions. For patients relying on these systems, this update naturally brings a degree of concern. It highlights the critical importance of regular follow-ups with their healthcare providers and understanding the signs of potential device malfunction. This situation is a vivid reminder that even with highly advanced and beneficial medical technology, ongoing vigilance and transparent communication are paramount to safeguarding patient well-being.</p>", "compliance_impact": "<ul><li><b>Enhanced Scrutiny for Medtronic:</b> Medtronic will face intensified regulatory scrutiny from the FDA, requiring comprehensive investigations into the root cause of battery depletion and connector corrosion. This will likely involve detailed data analysis, manufacturing process reviews, and potential updates to device labeling or instructions for use, impacting their production lines and potentially delaying future product innovations.</li><li><b>Disruption for Healthcare Providers:</b> Urologists, gastroenterologists, and other specialists who implant and manage InterStim systems will need to meticulously review patient registries to identify individuals with affected device models. They will also be responsible for educating patients on potential symptoms of device malfunction and managing the logistics of potential unscheduled device replacements, adding to their clinical burden.</li><li><b>Patient Anxiety and Health Risks:</b> For patients, this alert can cause significant anxiety and uncertainty about their treatment efficacy and safety. Beyond the emotional toll, the need for unscheduled surgical revisions poses direct health risks associated with any operative procedure, including infection, pain, and recovery time, potentially disrupting their regained quality of life.</li><li><b>Market Confidence and Investor Relations:</b> News of safety concerns, even when managed proactively, can erode market confidence in Medtronic's stock and the broader neuromodulation sector. Investors will closely watch the company's response, the financial implications of potential recalls or increased warranty costs, and the long-term impact on Medtronic's reputation and market share.</li><li><b>Reinforced Regulatory Focus on Device Longevity:</b> This incident reinforces the FDA's ongoing emphasis on the long-term reliability and longevity of implantable medical devices. It could lead to stricter guidelines for battery life testing, material compatibility assessments, and post-market surveillance requirements across the industry, particularly for devices with critical electrical or mechanical components.</li></ul>", "key_actions": "<ul><li><b>For Patients with InterStim Systems:</b> Do not panic, but immediately contact your prescribing physician or urologist if you experience any change in your therapy\u2019s effectiveness, symptoms returning, or notice any unusual discomfort around your implanted device. Ensure you attend all scheduled follow-up appointments and discuss any concerns proactively.</li><li><b>For Healthcare Providers and Clinics:</b> Carefully review the FDA's detailed safety communication and Medtronic's specific guidance. Identify all patients with potentially affected InterStim\u2122 Micro or InterStim\u2122 II models and proactively communicate with them about the potential issues, monitoring strategies, and next steps for assessment or intervention.</li><li><b>For Medical Device Manufacturers:</b> This serves as a critical reminder to reinforce rigorous design verification and validation processes, enhance manufacturing quality controls, and strengthen post-market surveillance systems to detect and address potential device malfunctions early. Transparent and swift communication with regulatory bodies and the public is paramount.</li><li><b>For Investors and Industry Watchers:</b> Monitor Medtronic\u2019s official statements and any subsequent FDA updates closely. Analyze the company's plans for corrective actions, potential financial impacts, and how this event might influence future regulatory expectations for implantable medical devices across the industry.</li></ul>", "industry_context": "<p>Sacral Neuromodulation (SNM) therapy, pioneered and largely dominated by Medtronic since the late 1990s with the introduction of InterStim, represents a significant leap forward in treating chronic bladder and bowel control issues. Before SNM, patients often faced limited options beyond medications with varying efficacy and side effects, or more invasive and less reversible surgical procedures. InterStim's innovative approach, which involves neuromodulation of the sacral nerves, offered a reversible, adjustable, and often highly effective solution for conditions like overactive bladder, non-obstructive urinary retention, and fecal incontinence, dramatically improving the quality of life for hundreds of thousands of patients globally.</p><p>Medtronic's InterStim\u2122 Systems hold a substantial share of the sacral neuromodulation market, solidifying the company's position as a leader in neurological and urological device innovation. Over the years, the technology has evolved significantly, from the initial InterStim II to the smaller, rechargeable InterStim\u2122 Micro, aiming to improve patient comfort, battery longevity, and overall user experience. These advancements reflect a continuous effort to refine complex implantable devices, which often involve intricate engineering related to battery technology, biocompatible materials, software algorithms, and miniaturization. Each iteration brings new benefits but also new challenges in manufacturing and long-term performance.</p><p>This regulatory update, even if specific to certain components or batches, reverberates across the entire medical device industry. It underscores the critical importance of robust quality management systems, rigorous manufacturing controls, and comprehensive post-market surveillance for implantable devices. Unlike pharmaceuticals, devices often have mechanical or electrical components that can degrade or malfunction over time in the harsh biological environment of the human body. Manufacturers are under constant pressure to balance innovation with unwavering reliability and patient safety. Regulators like the FDA continually monitor real-world device performance, relying on adverse event reports and manufacturers' data to identify potential systemic issues, ensuring that the benefits of these life-changing technologies continue to outweigh their inherent risks.</p>", "seo_title": "FDA Safety Alert: Medtronic InterStim\u2122 Systems and What It Means for Patients", "seo_description": "Dive into the latest FDA update concerning Medtronic InterStim\u2122 Systems. Understand the device, its critical role in treating bladder and bowel control issues, and the implications of this new safety alert for patients, healthcare providers, and the medical device industry.", "primary_company_name": "Medtronic Plc.", "source_url": "https://recalls-rappels.canada.ca/en/alert-recall/interstimtm-systems", "fetched_at": "2026-09-24T12:22:21.002705+00:00", "is_long_form": true}, {"id": "59d11ae152e7", "title": "Lilly's FDA-approved weekly insulin could mean over 300 fewer shots a year than daily insulin - stocktitan.net", "slug": "lilly-s-fda-approved-weekly-insulin-could-mean-over-300-fewer-shots-a-year-than-daily-insulin-stocktitan-net", "date": "2026-09-24", "category": "Drug Approval", "severity": "Low", "summary": "<p><b>Featured Article</b> on Zero483. The landscape of diabetes management is on the cusp of a profound transformation, thanks to a landmark regulatory decision by the U.S. Food and Drug Administration (FDA). In a move set to dramatically ease the burden for millions, pharmaceutical giant Eli Lilly has secured FDA approval for its innovative weekly insulin. This approval heralds a new era of convenience and adherence for individuals living with diabetes, offering the potential for over 300 fewer injections per year compared to the current daily insulin regimens.</p><p>For decades, insulin therapy, while life-saving, has presented a significant daily challenge for patients. The necessity of daily, or even multiple daily, injections often leads to injection fatigue, emotional distress, and, critically, non-adherence to prescribed regimens. This new weekly formulation from Lilly directly addresses this long-standing unmet need, promising a paradigm shift from daily needle-pricks to a single, weekly dose. This reduction in frequency is not merely a matter of comfort; it has profound implications for patient quality of life, mental well-being, and the overall effectiveness of diabetes control.</p><p>The FDA's decision underscores the agency's commitment to fostering innovations that directly improve patient outcomes and simplify complex treatment protocols. Such an approval is the culmination of extensive research, rigorous clinical trials demonstrating safety and efficacy, and a clear understanding of the real-world challenges faced by patients. Eli Lilly, with its long and storied history in diabetes care, has once again positioned itself at the forefront of medical advancement, bringing forth a solution that has the potential to redefine the standard of care.</p><p>This groundbreaking weekly insulin is expected to empower patients by giving them more control over their condition with less daily intrusion. It could significantly reduce the psychological toll of chronic disease management, encouraging greater adherence to therapy, which in turn leads to better glycemic control and fewer long-term complications associated with diabetes. This development represents a monumental leap forward, moving beyond incremental improvements to deliver a truly transformative option for the diabetes community.</p>", "compliance_impact": "<ul><li><b>Enhanced Patient Adherence and Quality of Life:</b> The most direct impact will be on patients, who will experience a substantial reduction in the burden of daily injections, leading to improved adherence to therapy, better glycemic control, and a significant boost in their overall quality of life and psychological well-being.</li><li><b>Revolutionized Clinical Practice:</b> Healthcare providers, particularly endocrinologists and primary care physicians, will have a powerful new tool in their arsenal. Simplifying the insulin regimen could streamline patient education, improve engagement, and potentially lead to better long-term outcomes and reduced complication rates.</li><li><b>Market Disruption and Competitive Pressure:</b> Eli Lilly\u2019s weekly insulin is poised to be a significant market disruptor, potentially shifting patient preferences and setting a new standard of care. This will likely intensify competition among pharmaceutical companies to develop similar long-acting or novel delivery mechanisms for insulin and other chronic medications.</li><li><b>Payer and Health System Considerations:</b> While a new, innovative drug might initially come with a premium price, the potential for improved adherence and better glycemic control could lead to long-term cost savings for health systems and payers by reducing emergency room visits, hospitalizations, and the management of diabetes-related complications.</li><li><b>Regulatory Endorsement of Patient-Centric Innovation:</b> The FDA's approval of such a significant convenience-improving therapy reinforces the agency's focus on approving drugs that not only demonstrate efficacy and safety but also address patient needs related to ease of use and adherence, paving the way for similar future innovations.</li></ul>", "key_actions": "<ul><li><b>For Patients and Caregivers:</b> Discuss this new weekly insulin option with your healthcare provider to understand if it\u2019s suitable for your specific diabetes management plan. Evaluate the potential benefits of reduced injection frequency against any new considerations or side effects.</li><li><b>For Healthcare Professionals:</b> Stay informed about the clinical profile, indications, and patient selection criteria for this new weekly insulin. Incorporate this innovative treatment into your understanding of diabetes management guidelines and patient counseling strategies.</li><li><b>For Pharmaceutical Industry Leaders:</b> Analyze the market reception and patient outcomes of this weekly insulin. Consider the implications for your own R&D pipelines, focusing on long-acting formulations and patient convenience as key drivers for future drug development.</li><li><b>For Investors and Market Analysts:</b> Monitor the commercial rollout and adoption rates of Lilly's weekly insulin. Assess its impact on Lilly's market share in the diabetes segment and the potential ripple effect on competitor strategies and the broader pharmaceutical market.</li><li><b>For Regulators and Policy Makers:</b> Observe the real-world evidence and patient feedback post-launch. This data will be crucial for informing future regulatory guidance on innovative drug delivery systems and patient-centric product development.</li></ul>", "industry_context": "<p>Diabetes, a chronic metabolic disorder characterized by high blood glucose levels, affects hundreds of millions globally. Type 1 diabetes, an autoimmune condition, requires lifelong insulin therapy as the body produces no insulin. Type 2 diabetes, far more prevalent, often involves insulin resistance and/or insufficient insulin production, with many patients eventually requiring insulin to manage their blood sugar effectively. Insulin itself is a hormone vital for converting food into energy and storing glucose. Without it, blood sugar levels can soar, leading to severe short-term complications and long-term damage to organs, nerves, and blood vessels.</p><p>The history of insulin is a testament to medical progress. Discovered in the early 20th century, animal-sourced insulin dramatically extended the lives of people with diabetes. Eli Lilly played a pivotal role, becoming the first company to commercialize insulin in 1923, revolutionizing diabetes treatment. Over the decades, advancements led to the development of human recombinant insulin, various analogues (rapid-acting, long-acting), and improved delivery methods like insulin pens and pumps. Despite these innovations, the fundamental requirement for daily, often multiple daily, injections remained a persistent challenge, contributing to injection fatigue and impacting patient adherence and overall quality of life.</p><p>The introduction of a weekly insulin formulation addresses this critical unmet need head-on. By drastically reducing the frequency of injections, it has the potential to significantly improve patient adherence, leading to more consistent blood sugar control and fewer diabetes-related complications. This innovation could represent a paradigm shift, setting a new benchmark for patient convenience and therapeutic efficacy in the diabetes market. For the pharmaceutical industry, it underscores the value of patient-centric research and development, potentially spurring a new wave of innovation in long-acting drug formulations across various therapeutic areas.</p>", "seo_title": "Game-Changer for Diabetes: Eli Lilly's Weekly Insulin Gets FDA Approval, Promises Fewer Shots and Better Lives", "seo_description": "Eli Lilly's groundbreaking weekly insulin receives FDA approval, potentially transforming diabetes management with over 300 fewer injections annually. Discover its impact on patients, healthcare, and the industry.", "primary_company_name": "Eli Lilly", "source_url": "https://news.google.com/rss/articles/CBMiuAFBVV95cUxNNTdCc25BLVJ0ZDRHa1Nvc1ZXSUxma2ZyelRtZVQ5eFA3c0Z4cnljNXU4RElQM1dRMjYyVlBhT3k2czVqOWY1NjQ4c1ZpaHRzbEJfbDhzT1BCWGxJa0h0ZV8yTVZmOXJabldTMGgxdjNXSkRYS0w3bmg5SEplc2xCX3h4WENfMngtcHZLMmVyWVUwVFUyenBUNXlTd09iakwydUxnMC1NRVdNVThoNDVFdTNqd1NmbWJx?oc=5", "fetched_at": "2026-09-24T12:20:23.672554+00:00", "is_long_form": true}, {"id": "8990be4f1cfa", "title": "Competition in South Korea\u2019s dry eye market with third homegrown drug approval - The Pharma Letter", "slug": "competition-in-south-korea-s-dry-eye-market-with-third-homegrown-drug-approval-the-pharma-letter", "date": "2026-09-24", "category": "Drug Approval", "severity": "Low", "summary": "<p>This **Featured Article** on Zero483 delves into a pivotal development poised to reshape the therapeutic landscape of Dry Eye Disease (DED) in South Korea. The recent approval of a third homegrown drug for this prevalent ophthalmic condition marks a significant milestone, intensifying competition within the market and underscoring the growing prowess of the nation's pharmaceutical industry. This isn't just another drug approval; it signals a strategic shift towards greater pharmaceutical self-sufficiency and innovation within South Korea, a nation increasingly recognized for its advanced biotechnology sector.</p><p>Dry Eye Disease, a chronic and often debilitating condition affecting millions globally, is characterized by insufficient tear production or excessive tear evaporation, leading to discomfort, visual disturbances, and potential damage to the ocular surface. Historically, treatment options have ranged from over-the-counter artificial tears to prescription medications like cyclosporine and lifitegrast, which aim to reduce inflammation and improve natural tear production. The introduction of a new domestic therapeutic option in South Korea promises to expand the arsenal available to ophthalmologists and patients, potentially offering novel mechanisms of action or improved safety and efficacy profiles tailored to the local population's needs.</p><p>The competitive implications of this approval are substantial. Established players in the South Korean dry eye market, including global pharmaceutical giants and previous domestic entrants, will undoubtedly face renewed pressure. This third homegrown drug is expected to challenge market shares, potentially driving down prices and stimulating further innovation as companies strive to differentiate their offerings. For patients, this translates into greater access to diverse treatment choices, and likely more affordable options as market dynamics encourage price competition.</p><p>Moreover, this regulatory nod highlights the robust capabilities of South Korean pharmaceutical companies in research, development, and manufacturing. Achieving regulatory approval for complex, chronic conditions like DED is no small feat, requiring rigorous clinical trials and adherence to stringent quality and safety standards set by the Ministry of Food and Drug Safety (MFDS). This latest success not only bolsters the local industry's reputation but also paves the way for potential future exports and international partnerships, showcasing South Korea as a significant player in global ophthalmic drug development.</p>", "compliance_impact": "<ul><li><b>Enhanced Market Competition:</b> The entry of a third homegrown drug will intensify the competitive landscape for all existing dry eye treatments in South Korea, prompting companies to innovate, differentiate their products, and potentially adjust pricing strategies to maintain or gain market share.</li><li><b>Expanded Patient Access and Choice:</b> Patients suffering from Dry Eye Disease in South Korea will benefit from a broader array of therapeutic options. This increased choice could lead to improved treatment outcomes, better adherence, and potentially more personalized treatment regimens as physicians gain access to diverse pharmacological profiles.</li><li><b>Pressure on Established Players:</b> Multinational pharmaceutical companies and earlier domestic entrants with existing dry eye medications will need to reassess their market strategies, potentially investing more in post-market surveillance, real-world evidence, and patient support programs to retain their competitive edge.</li><li><b>Validation for Domestic Innovation:</b> This approval serves as a strong validation for South Korea's pharmaceutical research and development capabilities, signaling to global investors and partners the maturity and potential of its biotech sector for developing and commercializing complex new drugs.</li><li><b>Potential for Cost-Effectiveness:</b> Increased domestic competition often leads to more favorable pricing for healthcare systems and patients. While the initial pricing of the new drug is unknown, the overall market trend may shift towards more cost-effective options over time.</li></ul>", "key_actions": "<ul><li><b>For Pharmaceutical Manufacturers:</b> Companies currently operating in or considering the South Korean dry eye market should conduct a thorough market analysis, re-evaluate their competitive positioning, and consider strategies such as portfolio diversification, enhanced patient engagement, or strategic partnerships.</li><li><b>For Healthcare Providers and Ophthalmologists:</b> Stay informed about the characteristics, efficacy, and safety profile of this newly approved homegrown drug. Engage with pharmaceutical representatives and medical literature to understand its place in the current treatment algorithm for DED.</li><li><b>For Patients and Caregivers:</b> Discuss new treatment options with your ophthalmologist. Be proactive in asking about the latest advancements, including this new homegrown drug, to determine if it could be a suitable addition or alternative to your current dry eye management plan.</li><li><b>For Investors in the Pharma Sector:</b> Monitor the performance of companies in the South Korean ophthalmic market. This approval could signal new investment opportunities in domestic pharmaceutical companies demonstrating strong R&D capabilities and market penetration potential.</li><li><b>For Regulatory and Policy Makers:</b> Observe the impact of this increased competition on drug pricing, patient access, and overall public health outcomes. This case study can provide valuable insights for future policy decisions aimed at fostering domestic innovation while ensuring affordable healthcare.</li></ul>", "industry_context": "<p>Dry Eye Disease (DED) is a multifactorial disease of the ocular surface characterized by a loss of homeostasis of the tear film, accompanied by ocular symptoms, in which tear film instability and hyperosmolarity, ocular surface inflammation and neurosensory abnormalities play etiological roles. Its global prevalence varies widely but is estimated to affect 5-50% of adults, with increasing incidence in aging populations and those with significant screen time. Symptoms range from stinging, burning, and gritty sensations to blurred vision and photophobia, significantly impacting quality of life.</p><p>The therapeutic landscape for DED has evolved considerably over the past decades. Initial treatments focused on symptomatic relief with artificial tears. More advanced prescription therapies, such as topical cyclosporine (e.g., Restasis) and lifitegrast (e.g., Xiidra), target the underlying inflammation, offering long-term management for many patients. Recent innovations have also included steroid eye drops for acute flares, secretagogues, and biologic agents. The global dry eye market is a lucrative and rapidly growing segment, driven by an aging population, increased digital device usage, and a better understanding of the disease's pathophysiology.</p><p>South Korea has emerged as a significant hub for pharmaceutical and biotechnology innovation. The nation's Ministry of Food and Drug Safety (MFDS) maintains rigorous standards for drug approval, ensuring that new therapeutics meet high bars for safety, efficacy, and quality. The term 'homegrown' is particularly important here, as it signifies a domestic company successfully navigating the entire drug development pipeline, from discovery to commercialization, within Korea. This not only strengthens the national economy but also addresses local healthcare needs with products potentially optimized for the South Korean patient population, reflecting a growing trend of self-reliance and advanced pharmaceutical capabilities in Asia.</p>", "seo_title": "South Korea's Dry Eye Market Heats Up: Third Homegrown Drug Approval Intensifies Competition", "seo_description": "A new homegrown drug approval is set to transform South Korea's dry eye market, boosting competition and offering new therapeutic options for patients. Dive into the implications   function stripHtml(s) {
    return String(s || '').replace(/<[^>]*>?/gm, '');

  function truncateSummary(s, maxLength = 220) {
    const text = stripHtml(s);
    if (text.length <= maxLength) return text;
    return text.substring(0, maxLength).trim() + '...';
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatDate(iso) {
    try {

  function applyFilters() {
    const q = searchQuery.toLowerCase().trim();
    const filtered = allItems.filter(item => {
      const matchCat = activeFilter === 'All' || item.category === activeFilter;
      if (!matchCat) return false;
      if (!q) return true;
      return (
        (item.title  || '').toLowerCase().includes(q) ||
        (item.summary|| '').toLowerCase().includes(q)
      );
    });
    renderFeed(filtered);
  }

  function init() {
    if (INJECTED_DATA && INJECTED_DATA.items) {
      allItems = INJECTED_DATA.items.filter(i => ['Recall', 'Drug Shortage', 'Adverse Event'].includes(i.category));
      
      const params = new URLSearchParams(window.location.search);
      if (params.has('q')) {
        searchQuery = params.get('q');
        searchInput.value = searchQuery;
      }
      
      applyFilters();
      
      // Initialize Ticker
      const tickerWrap = document.getElementById('z483-ticker-wrap');
      const tickerContent = document.getElementById('z483-ticker-content');
      if (tickerWrap && tickerContent && allItems.length > 0) {
        const top5 = allItems.slice(0, 5);
        let tHtml = top5.map(i => `<a href="${escHtml(i.source_url)}" target="_blank" class="z483-ticker-item">${escHtml(stripHtml(i.title))}</a>`).join(' &bull; ');
        tickerContent.innerHTML = tHtml + ' &bull; ' + tHtml; // Duplicate for seamless scroll
        tickerWrap.style.display = 'flex';
      }
    } else {
      feed.innerHTML = `
        <div class="z483-state">
          <h3>No Data Available</h3>
          <p>Please run the python script to inject data.</p>
        </div>`;
    }
  }

  // Fallback data for local preview if no injected data
  if (!INJECTED_DATA) {
    setTimeout(() => {
      // If still null, just clear
      if (!allItems.length) {
        init();
      }
    }, 100);
  } else {
    init();
  }
